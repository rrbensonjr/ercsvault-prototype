    { el:"Renewal, yearly", v:"Annual test results, the AHJ confirming coverage still holds, and an active service agreement" },
    { el:"A deficiency", v:"the Radio Compliance Team is told at once and the AHJ is directed to shut the system down until it is resolved" },
    { el:"Campuses", v:"One head-end, one provisional authorization, one completion certificate" }
  ]}
];

/* Rules the document sets, but the specifics it leaves to each project. */
const ELSEWHERE = [
  { el:"Whether a building needs a system at all", who:"decided per building — by the grid survey and the fire AHJ's DAQ test" },
  { el:"Site coordinates, the designer of record, the equipment chosen", who:"supplied per project in the design plan" }
];

/* The digest an integrator should read first, drawn from the same reading below. */
const BRIEF = [
  { b:"Coverage is judged by DAQ 3.0, not by a signal level.",
    t:"Coverage is judged by delivered audio quality, inbound and outbound. The document says the NFPA standards no longer set a dBm figure, and that its own −102 dBm is a reference for the grid report — a design can clear that number and still fail here." },
  { b:"No percentage appears anywhere in this program.",
    t:"There is no coverage percentage anywhere in this program — no 95% of floor area, no area count. A design narrative built around one does not answer this jurisdiction, what decides the result is delivered audio quality, not a share of the floor." },
  { b:"Five equipment constraints govern the design.",
    t:"Independent 700/800 MHz uplink control · no cellular, LTE or FirstNet retransmission · hardline or leaky coax only, LMR200/400/600 not permitted · two independent power supplies, twelve hours at full load · delay under 30 µs with isolation 20 dB above maximum gain." },
  { b:"The uplink budget is a hard number, and the filter count is fixed.",
    t:"No more than −70 dBm at the licensee's tower in the calculation, and under −70 dBm measured at turn-up with no change to the noise floor. A Class A system on this network takes twenty frequency pairs, and the plan declares the band, the filters and the delay." },
  { b:"Each test has a named owner.",
    t:"The grid survey is carried out by the ERCES Integrator, through a licensed BDA/DAS contractor. The DAQ test is the fire AHJ's, witnessed by the licensee, and the uplink amplifier is never energized without written approval from every license holder. If the AHJ declines the test, the licensee runs it at $300 plus $120 an hour." }
];

const $ = id => document.getElementById(id);
let loaded = false;

function rows(){ return LAYERS.reduce((n,L) => n + L.rows.length, 0); }
function read(){ return LAYERS.reduce((n,L) => n + L.rows.filter(r => r.v && !r.set).length, 0); }
function lacking(){ return LAYERS.reduce((n,L) => n + L.rows.filter(r => !r.v && !r.set).length, 0); }

function summary(){
  $("briefrows").innerHTML = BRIEF.map(function(x){
    return '<div class="brow"><span><b>' + x.b + '</b><span class="bt">' + x.t + '</span></span>' +
      '</div>';
  }).join("");

  $("readings").innerHTML = LAYERS.map(function(L){
    return '<div class="lay"><h3>' + L.g + '</h3>' + L.rows.map(function(r){
      if (r.set){
        return '<div class="xrow"><span class="el">' + r.el + '</span>' +
          '<span class="v"><b>' + r.set + '</b><span class="sub2">Set by the AHJ — not read from the document.</span></span>' +
          '</div>';
      }
      if (r.v){
        return '<div class="xrow"><span class="el">' + r.el + '</span>' +
          '<span class="v"><b>' + r.v + '</b>' + (r.sub ? '<span class="sub2">' + r.sub + '</span>' : '') + '</span>' +
          '</div>';
      }
      return '<div class="xrow flat"><span class="el">' + r.el + '</span>' +
        '<span class="v"><b>Not found.</b><span class="sub2">' + r.missing + '</span>' +
        '<span class="setter"><input type="text" placeholder="Set it by hand" data-el="' + r.el + '">' +
        '<button class="quick" data-save="' + r.el + '" type="button">Save</button></span></span>' +
        '</div>';
    }).join("") + '</div>';
  }).join("");

  $("tally").innerHTML =
    '<span><b>' + read() + '</b> of ' + rows() + ' elements read from the document</span>' +
    '<span><b>' + lacking() + '</b> not stated in it</span>' +
    '<span><b>' + ELSEWHERE.length + '</b> left to the project</span>';

  const miss = [];
  LAYERS.forEach(L => L.rows.forEach(r => { if (!r.v && !r.set) miss.push(r.el); }));
  $("srctag").textContent = "read from " + DOC.pages + " pages";
}

function load(name, size, pages, instant){
  loaded = true;
  $("empty").hidden = true;
  $("summary").hidden = true;
  $("lfcrit").hidden = true;
  $("loaded").hidden = true;
  $("reading").hidden = !!instant;
  $("rpages").textContent = pages || DOC.pages;
  setTimeout(function(){
    $("reading").hidden = true;
    $("loaded").hidden = false;
    $("summary").hidden = false;
    $("lfcrit").hidden = false;
    $("dname").textContent = name;
    $("dmeta").textContent = (pages || DOC.pages) + " pages · " + (size || DOC.size) +
      " · uploaded today";
    $("dhash").textContent = "SHA-256 " + DOC.hash + " — kept as received, never rewritten";
    $("docnum").textContent = name;
    summary();
  }, instant ? 0 : 1200);
}

$("choose").addEventListener("click", function(){ load(DOC.name, DOC.size, DOC.pages); });

$("repl").addEventListener("click", function(){
  loaded = false;
  $("loaded").hidden = true; $("summary").hidden = true; $("lfcrit").hidden = true; $("empty").hidden = false;
  $("docnum").textContent = "—"; $("srctag").textContent = "no document yet";
});

const drop = $("drop");
["dragenter","dragover"].forEach(function(ev){
  drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add("over"); });
});
["dragleave","drop"].forEach(function(ev){
  drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove("over"); });
});
drop.addEventListener("drop", function(e){
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  const kb = f ? Math.max(1, Math.round(f.size / 1024)) : null;
  load(f ? f.name : DOC.name, kb ? kb + " KB" : DOC.size, DOC.pages);
});

document.addEventListener("click", function(e){
  const el = e.target.dataset && e.target.dataset.save;
  if (!el) return;
  const input = document.querySelector('[data-el="' + el + '"]');
  const val = input && input.value.trim();
  if (!val) return;
  LAYERS.forEach(L => L.rows.forEach(r => { if (r.el === el) r.set = val; }));
  summary();
});

/* The page arrives read. What it is for is the reading — the drop zone is one button
   away, so handing over a document is still demonstrable without being a prerequisite. */
load(DOC.name, DOC.size, DOC.pages, true);
</script>

<script>
(function(){
  // Review chrome is identified by how a block OPENS, not by any mention anywhere -
  // "Facts only. No verdict." and "Who holds this project now" are product copy that
  // happens to sit near a dated citation, and blanket matching removed them.
  // Review chrome is identified by how a block OPENS, not by any mention anywhere -
  // "Facts only. No verdict." and "Who holds this project now" are product copy that
  // happens to sit near a dated citation.
  var HEAD = /^(settled|marked up|all four answered|what we (still )?need from you|what occupancy opened up|four questions|everything on this screen is answered|where these come from placeholder|open\s*(&mdash;|—|-)\s*not drawn here|\d+\s*[·.]\s)/i;
  var REVIEWY = /\byou (said|wrote|asked for)\b|your (words|position)\b|\bwe (may have|picked|guessed)\b|unrefuted|tabled|still a slot|phase one, exactly/i;
  var CITE = [
    /\b(Your words|Your position|You said|You wrote|Rob said|Rob:|Rob,)[^.!?]*[.!?]\s*/gi,
    /\bSettled\b[^.!?]*[.!?]\s*/gi,
    /\bMarked up\b[^.!?]*[.!?]\s*/gi
  ];
  var sweeping = false;
  var txtOf = function(el){ return (el.textContent || '').replace(/\s+/g, ' ').trim(); };

  // A screen may opt out of the inline glossary underlines - the program screen does, because
  // its own heading is the jargon. The words stay in the glossary panel; they lose the marking.
  function termsOff(){ return !!document.querySelector('[data-um="no-inline-terms"]'); }

  function decite(el){
    var hit = false, w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null), ns = [], n;
    while((n = w.nextNode())) ns.push(n);
    ns.forEach(function(t){
      var before = t.nodeValue, after = before;
      CITE.forEach(function(re){ after = after.replace(re, ''); });
      if(after !== before){ t.nodeValue = after; hit = true; }
    });
    if(hit){
      el.querySelectorAll('em,i,blockquote').forEach(function(q){
        if(/^["“‘']/.test((q.textContent || '').trim())) q.remove();
      });
      if(!txtOf(el)) el.remove();
    }
    return hit;
  }

  // A note box is a note box however true its contents. The useful ones keep their
  // words but lose the callout: they become a quiet info chip you open if you want it.
  function toChip(el){
    if(termsOff()){ el.remove(); return; }
    var head = el.querySelector('strong,b,h4');
    var label = head ? txtOf(head).replace(/[.:—-]\s*$/, '') : 'About this';
    var body = el.innerHTML;
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'um-chip um-def';
    chip.dataset.t = label;
    chip.dataset.d = body;
    chip.textContent = label;
    el.parentNode.replaceChild(chip, el);
  }

  function sweep(){
    if(sweeping) return; sweeping = true;
    try{
      document.querySelectorAll('.proto,.ask,.askbox,.lineage').forEach(function(el){ el.remove(); });
      document.querySelectorAll('.rcard,.corr').forEach(function(el){
        if(HEAD.test(txtOf(el)) || REVIEWY.test(txtOf(el))) el.remove(); else decite(el);
      });
      document.querySelectorAll('.note').forEach(function(el){
        var t = txtOf(el);
        if(HEAD.test(t) || REVIEWY.test(t)){ el.remove(); return; }
        decite(el);
        if(el.parentNode && txtOf(el)) toChip(el);
      });
      document.querySelectorAll('.rail').forEach(function(r){
        if(!r.querySelector('*')){
          r.style.display = 'none';
          var c = r.closest ? r.closest('.cols') : null;
          if(c) c.style.gridTemplateColumns = 'minmax(0,1fr)';
        }
      });
    } finally { sweeping = false; }
  }

  var TERMS = [
   ["ERCES","Emergency Responder Communication Enhancement System. Equipment installed in a building so firefighters and police keep radio coverage inside it — thick walls and basements are where ordinary portable radios fail."],
   ["BDA","Bi-Directional Amplifier. The box at the heart of most systems: it takes the public-safety signal from outside, amplifies it, and rebroadcasts it indoors — and back out again."],
   ["AHJ","Authority Having Jurisdiction — in practice the fire marshal or fire code official. The party that decides whether a building needs a system and whether the finished one is acceptable."],
   ["benchmark test","A radio survey of the building as it stands today, before anything is installed. It is the evidence the fire marshal weighs when deciding whether a system is needed at all."],
   ["acceptance test","The radio survey of the finished, installed system. Same measurements as the benchmark, taken to prove the system does what the design promised."],
   ["annual test","The recurring test an owner owes every year for as long as the system exists. It is graded against the jurisdiction's current requirements, not the ones in force when the building was approved."],
   ["margin","How far a measurement sits from the threshold it is judged against, rather than simply which side of it landed. Three decibels short is a very different conversation from thirty."],
   ["donor antenna","The rooftop antenna that talks to the public-safety tower. Everything indoors depends on this one link."],
   ["retransmission authorization","The frequency holder's written permission to rebroadcast its channels inside a building. Without it there is nothing lawful to amplify, whatever the fire marshal says."],
   ["frequency holder","The public-safety agency that actually holds the radio licence — often a county or a statewide network. It owns the channels a building's system rebroadcasts."],
   ["integrator","The firm that designs, installs, tests and maintains the system. The owner is responsible for compliance; the integrator is who does the work."],
   ["waiver","A fire marshal's written record that a building was accepted without meeting the coverage criteria. It does not expire, it binds whoever holds the office next, and only a change to the building reopens it."],
   ["as-built","The record of what was actually installed, which is rarely exactly what was drawn. Filed after installation and before the acceptance test."],
   ["vesting","The moment a project's rulebook is fixed. Approval of the design settles which edition of the code the job is measured against, even if the county changes its rules later."],
   ["program","Everything a jurisdiction has configured for itself — the code edition it adopted, its technical requirements, and what it asks to be filed. Every project in that jurisdiction is measured against it."],
   ["maintenance and monitoring agreement","The contract keeping a system serviced for its lifetime. The code requires an active one at all times, but contracts run one, three or five years — so they have to be renewed, and a gap is a real state."],
   ["remote shutdown","The one control here that changes something in the physical world: it takes a system off the air. Both the fire marshal and the frequency holder hold it."],
   ["approved tester","Where a jurisdiction requires one, an independent testing firm — independent of the integrator, and on the jurisdiction's approved list. Many jurisdictions require no such thing."],
   ["part-approved","A project where some buildings have been approved and others have not. It is a normal resting state on a campus, not a problem to be cleared."],
   ["channel group","One public-safety network a building is tested against. A building on three networks is graded three times, separately, and must pass all of them."],
   ["dBm","The unit signal strength is measured in. It runs negative, and less negative is stronger: &minus;85 dBm is a better signal than &minus;95 dBm."],
   ["NT","Not tested. A square of the building grid carrying no measurement — neither a pass nor a fail, and worth knowing about rather than assuming."],
   ["solicitation","An outstanding request waiting on a named party. Everything that looks like a stalled project is really one of these, unanswered."],
   ["owner of record","The party legally responsible for a building's compliance. They delegate the work to an integrator but never the responsibility, which is why they are told directly when something lapses."]
  ];

  var pop = null;
  function close(){ if(pop){ pop.remove(); pop = null; } }
  function open(el, term, def){
    close();
    pop = document.createElement('div');
    pop.className = 'um-pop';
    pop.innerHTML = '<button class="um-x" aria-label="Close">&times;</button><b></b><div class="um-body"></div>';
    pop.querySelector('b').textContent = term;
    pop.querySelector('.um-body').innerHTML = def;
    pop.querySelector('.um-x').addEventListener('click', close);
    document.body.appendChild(pop);
    var r = el.getBoundingClientRect();
    var w = pop.offsetWidth, h = pop.offsetHeight;
    var left = Math.min(Math.max(8, r.left), (document.documentElement.clientWidth || 800) - w - 8);
    var top = r.bottom + 7;
    if(top + h > (document.documentElement.clientHeight || 600) - 8) top = Math.max(8, r.top - h - 7);
    pop.style.left = left + 'px'; pop.style.top = top + 'px';
  }
  document.addEventListener('click', function(e){
    var d = e.target.closest ? e.target.closest('.um-def') : null;
    if(d){ e.stopPropagation(); open(d, d.dataset.t, d.dataset.d); return; }
    if(!e.target.closest || !e.target.closest('.um-pop')) close();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') close();
    if((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('um-def')){
      e.preventDefault(); open(e.target, e.target.dataset.t, e.target.dataset.d);
    }
  });
  addEventListener('scroll', close, true);
  addEventListener('resize', close);

  var SKIP = {SCRIPT:1,STYLE:1,TEXTAREA:1,TITLE:1,OPTION:1,SELECT:1,SVG:1,svg:1,TEMPLATE:1};
  function decorate(){
    if(termsOff()) return;
    var done = {};
    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
      acceptNode: function(n){
        if(!n.nodeValue || n.nodeValue.length < 3) return NodeFilter.FILTER_REJECT;
        for(var p = n.parentNode; p && p !== document.body; p = p.parentNode){
          if(SKIP[p.nodeName] || (p.classList && p.classList.contains('um-def'))) return NodeFilter.FILTER_REJECT;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var texts = [], t;
    while((t = walker.nextNode())) texts.push(t);

    for(var i=0;i<texts.length;i++){
      var node = texts[i];
      for(var j=0;j<TERMS.length;j++){
        var term = TERMS[j][0];
        if(done[term]) continue;
        var re = new RegExp('(^|[^A-Za-z-])(' + term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')(?![A-Za-z-])',
                            term === term.toUpperCase() ? '' : 'i');
        var m = re.exec(node.nodeValue);
        if(!m) continue;
        var start = m.index + m[1].length;
        var span = document.createElement('span');
        span.className = 'um-def'; span.tabIndex = 0;
        span.setAttribute('role','button');
        span.dataset.t = term; span.dataset.d = TERMS[j][1];
        span.title = 'What this means';
        var after = node.splitText(start);
        after.splitText(m[2].length);
        span.textContent = after.nodeValue;
        after.parentNode.replaceChild(span, after);
        done[term] = 1;
        break;
      }
    }
  }

  function boot(){ sweep(); decorate(); }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
  setTimeout(boot, 400);
  setTimeout(sweep, 1200);
  new MutationObserver(function(){ sweep(); }).observe(document.documentElement, {childList:true, subtree:true});
})();
</script>

<div class="proto">Prototype — invented projects, invented dates. Built to be marked up, not used.</div>

<div class="toolbar"><div class="tb-in">
  <label class="sw2"><input type="checkbox" id="onlyMe"> <span>Show only what needs a decision</span></label>

<div class="wrap">
<header>
  <h1>What is waiting on the Authority Having Jurisdiction</h1>
  <p class="sub">Eleven things are open in this jurisdiction. <strong>Four of them are this
  jurisdiction's to decide.</strong> The rest are here to be seen, not acted on.</p>
  <div class="juris">
    <span class="name">City of Raleigh &mdash; Fire Department</span>
    <span class="vtag">Program v1.0 &middot; in force since 2026-03-01</span>
  </div>
</header>

<div class="cols">
<div id="lanes"></div>

<div class="rail">
  <div class="rcard">
    <h3>Arriving on a Clock</h3>
    <div style="padding:14px 16px" id="clocks"></div>
  </div>
  <div class="ask">
    <h3>Settled with Rob &mdash; 2026-08-19</h3>
    <ol>
      <li><strong>The three-lane split is right.</strong> Approval, consultation and
        notification are three relationships, not three degrees of one &mdash; confirmed.</li>
      <li><strong>Part-approved stays as one row</strong> with the buildings inside it. The
        project is the unit; the approvals are per building; the queue shows both at once.</li>
      <li><strong>There are no deadlines.</strong> Not &ldquo;we do not know them yet&rdquo;
        &mdash; there are none to know. So the age is a plain fact and always will be, and
        &ldquo;overdue&rdquo; is not a state this product can ever show.</li>
      <li><strong>The clock items belong here</strong>, and one was missing:
        <strong>maintenance agreements expiring</strong>, now in the panel. These are the work
        that arrives on a date rather than in a submittal.</li>
    </ol>
  </div>
  <div class="ask">
    <h3>Settled with Rob &mdash; 2026-09-16</h3>
    <ol>
      <li><strong>Keep the AHJ out of commercial matters.</strong> <i>&ldquo;A signed agreement is
        enough on its own&hellip; the outgoing integrator keeps read access. Only one alert.&rdquo;</i>
        A project moves to a new firm on the document, with no gate here &mdash; so it is a
        notification row, never a decision. The first boundary drawn around what this authority is
        asked to do, and it will decide other questions the same way.</li>
      <li><strong>No separate alert for a project with no firm attached.</strong> The lapsed
        maintenance agreement is the alert, and it is already in your clock panel. The two are not
        the same event: agreements run one, three and five years, so the common lapse is the same
        firm renewing with nobody going anywhere.</li>
    </ol>
  </div>
</div>
</div>

<script>
const Q = [
 {lane:"you", rel:"appr", nm:"400 Fayetteville Street", sub:"Benchmark in hand — does this building need a system?",
  stage:"Stage 2 · Determination", age:3},
 {lane:"you", rel:"appr", nm:"Duke Health — Erwin Road campus", sub:"Design package · 3 buildings",
  stage:"Stage 4 · Design", age:11, partial:true,
  bldgs:[["Ardmore Tower","approved 2026-08-08",true],["Clinic South","approved 2026-08-08",true],["Research Annex","not yet decided",false]]},
 {lane:"you", rel:"appr", nm:"Raleigh Convention Center", sub:"Acceptance test report · 1 building",
  stage:"Stage 6 · Acceptance", age:34},
 {lane:"you", rel:"appr", nm:"North Hills Tower II", sub:"As-built package · 1 building",
  stage:"Stage 5 · Installation", age:6},

 {lane:"else", rel:"cons", nm:"Midtown East", sub:"VIPER consulted — whether a system is warranted here",
  stage:"Stage 2 · Determination", age:9},
 {lane:"else", rel:"noti", nm:"Lenovo Center", sub:"Retransmission authorization request",
  stage:"Stage 3 · Frequency authorization", age:5},
 {lane:"else", rel:"cons", nm:"Wake Tech — Building C", sub:"VIPER consulted — review of the donor design",
  stage:"Stage 4 · Design", age:2},

 {lane:"fyi", rel:"noti", nm:"Glenwood South Residences", sub:"Benchmark test report filed",
  stage:"Stage 1 · Benchmark", age:1},
 {lane:"fyi", rel:"noti", nm:"Cary Towne Center", sub:"Annual coverage test filed",
  stage:"Stage 7 · Annual", age:4},
 {lane:"fyi", rel:"noti", nm:"One Glenwood", sub:"Maintenance and monitoring agreement filed",
  stage:"Stage 7 · Annual", age:12},
 {lane:"fyi", rel:"noti", nm:"Dorothea Dix Park Ops", sub:"Benchmark test report filed",
  stage:"Stage 1 · Benchmark", age:20},
 {lane:"fyi", rel:"noti", nm:"Stanhope Square", sub:"Integrator of record changed · Apex Communications replaces Carolina Wireless",
  stage:"Stage 7 · Annual", age:2}
];

const CLOCKS = [
 {n:3, t:"Operating permits expire within 30 days",
  d:"Nobody submits anything. The date arrives on its own — and the program requires a permit to operate."},
 {n:4, t:"Maintenance agreements expiring",
  d:"Code requires an owner with an ERCES to have an <b>active</b> agreement. The obligation lasts the life of the system; the contracts run one, three or five years — so each one ends and a new one has to start."},
 {n:12, t:"Annual coverage tests due this quarter",
  d:"The program sets annual retesting. These become submittals only if somebody remembers."},
 {n:1, t:"Frequency authorization expiring",
  d:"Lenovo Center. Renewal needs the frequency holder, not the Authority Having Jurisdiction."}
];

const LANES = [
 ["you","Waiting on the Authority Having Jurisdiction","This jurisdiction decides these. Nothing moves until it does."],
 ["else","Waiting on someone else","Somebody else has been asked, or it is not this jurisdiction's to decide. Shown so nothing is a surprise."],
 ["fyi","For information","Copies. Nothing here waits on anybody — commenting is optional."]
];

let onlyMe = false;
const $ = id => document.getElementById(id);

function render(){
  const host = $("lanes"); host.innerHTML = "";
  LANES.forEach(([key,title,sub]) => {
    if (onlyMe && key !== "you") return;
    const items = Q.filter(q => q.lane === key);
    const w = document.createElement("div");
    w.className = "lane";
    w.innerHTML = '<div class="lanehead"><h2>' + title + '</h2><span class="n">' + items.length +
      '</span><span class="sub2">' + sub + '</span></div>';
    items.forEach(q => w.appendChild(item(q)));
    host.appendChild(w);
  });
  $("tbn").innerHTML = onlyMe
    ? "Hiding 7 items that are not this jurisdiction's to act on."
    : "Of 11 open items, <b>4</b> are this jurisdiction's to decide.";
}

function item(q){
  const el = document.createElement("div");
  el.className = "item " + q.lane;
  const rel = q.rel === "appr" ? '<span class="rel2 appr">approval</span>'
            : q.rel === "cons" ? '<span class="rel2 cons">consultation</span>'
            : '<span class="rel2 noti">notification</span>';
  let h = '<div class="main"><div class="nm">' + q.nm +
    (q.partial ? ' <span class="partial">part-approved</span>' : '') + '</div>' +
    '<div class="sub3">' + q.sub + '</div>' +
    '<div class="meta2"><span class="stage">' + q.stage + '</span>' + rel + '</div>' +
    (q.note ? '<div class="sub3" style="margin-top:7px">' + q.note + '</div>' : '');
  if (q.bldgs){
    h += '<div class="bldgs">' + q.bldgs.map(b =>
      '<div class="b"><span class="dot ' + (b[2] ? "ok" : "no") + '"></span>' + b[0] +
      '<span class="st">' + b[1] + '</span></div>').join("") + '</div>';
  }
  h += '</div><div class="age"><b>' + q.age + '</b>' + (q.age === 1 ? "day" : "days") + '</div>';
  el.innerHTML = h;
  return el;
}

$("clocks").innerHTML = CLOCKS.map(c =>
  '<div class="clock"><span class="big">' + c.n + '</span><span><b>' + c.t + '</b>' +
  '<span class="sub3">' + c.d + '</span></span></div>').join("") +
  '<p class="lineage">These are the only things here that nobody submitted. ' +
  '<b>The platform is watching a clock rather than routing a document.</b></p>';

$("onlyMe").addEventListener("change", e => { onlyMe = e.target.checked; render(); });
render();
</script>

<script>
(function(){
  // Review chrome is identified by how a block OPENS, not by any mention anywhere -
  // "Facts only. No verdict." and "Who holds this project now" are product copy that
  // happens to sit near a dated citation, and blanket matching removed them.
  // Review chrome is identified by how a block OPENS, not by any mention anywhere -
  // "Facts only. No verdict." and "Who holds this project now" are product copy that
  // happens to sit near a dated citation.
  var HEAD = /^(settled|marked up|all four answered|what we (still )?need from you|what occupancy opened up|four questions|everything on this screen is answered|where these come from placeholder|open\s*(&mdash;|—|-)\s*not drawn here|\d+\s*[·.]\s)/i;
  var REVIEWY = /\byou (said|wrote|asked for)\b|your (words|position)\b|\bwe (may have|picked|guessed)\b|unrefuted|tabled|still a slot|phase one, exactly/i;
  var CITE = [
    /\b(Your words|Your position|You said|You wrote|Rob said|Rob:|Rob,)[^.!?]*[.!?]\s*/gi,
    /\bSettled\b[^.!?]*[.!?]\s*/gi,
    /\bMarked up\b[^.!?]*[.!?]\s*/gi
  ];
  var sweeping = false;
  var txtOf = function(el){ return (el.textContent || '').replace(/\s+/g, ' ').trim(); };

  // A screen may opt out of the inline glossary underlines - the program screen does, because
  // its own heading is the jargon. The words stay in the glossary panel; they lose the marking.
  function termsOff(){ return !!document.querySelector('[data-um="no-inline-terms"]'); }

  function decite(el){
    var hit = false, w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null), ns = [], n;
    while((n = w.nextNode())) ns.push(n);
    ns.forEach(function(t){
      var before = t.nodeValue, after = before;
      CITE.forEach(function(re){ after = after.replace(re, ''); });
      if(after !== before){ t.nodeValue = after; hit = true; }
    });
    if(hit){
      el.querySelectorAll('em,i,blockquote').forEach(function(q){
        if(/^["“‘']/.test((q.textContent || '').trim())) q.remove();
      });
      if(!txtOf(el)) el.remove();
    }
    return hit;
  }

  // A note box is a note box however true its contents. The useful ones keep their
  // words but lose the callout: they become a quiet info chip you open if you want it.
  function toChip(el){
    if(termsOff()){ el.remove(); return; }
    var head = el.querySelector('strong,b,h4');
    var label = head ? txtOf(head).replace(/[.:—-]\s*$/, '') : 'About this';
    var body = el.innerHTML;
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'um-chip um-def';
    chip.dataset.t = label;
    chip.dataset.d = body;
    chip.textContent = label;
    el.parentNode.replaceChild(chip, el);
  }

  function sweep(){
    if(sweeping) return; sweeping = true;
    try{
      document.querySelectorAll('.proto,.ask,.askbox,.lineage').forEach(function(el){ el.remove(); });
      document.querySelectorAll('.rcard,.corr').forEach(function(el){
        if(HEAD.test(txtOf(el)) || REVIEWY.test(txtOf(el))) el.remove(); else decite(el);
      });
      document.querySelectorAll('.note').forEach(function(el){
        var t = txtOf(el);
        if(HEAD.test(t) || REVIEWY.test(t)){ el.remove(); return; }
        decite(el);
        if(el.parentNode && txtOf(el)) toChip(el);
      });
      document.querySelectorAll('.rail').forEach(function(r){
        if(!r.querySelector('*')){
          r.style.display = 'none';
          var c = r.closest ? r.closest('.cols') : null;
          if(c) c.style.gridTemplateColumns = 'minmax(0,1fr)';
        }
      });
    } finally { sweeping = false; }
  }

  var TERMS = [
   ["ERCES","Emergency Responder Communication Enhancement System. Equipment installed in a building so firefighters and police keep radio coverage inside it — thick walls and basements are where ordinary portable radios fail."],
   ["BDA","Bi-Directional Amplifier. The box at the heart of most systems: it takes the public-safety signal from outside, amplifies it, and rebroadcasts it indoors — and back out again."],
   ["AHJ","Authority Having Jurisdiction — in practice the fire marshal or fire code official. The party that decides whether a building needs a system and whether the finished one is acceptable."],
   ["benchmark test","A radio survey of the building as it stands today, before anything is installed. It is the evidence the fire marshal weighs when deciding whether a system is needed at all."],
   ["acceptance test","The radio survey of the finished, installed system. Same measurements as the benchmark, taken to prove the system does what the design promised."],
   ["annual test","The recurring test an owner owes every year for as long as the system exists. It is graded against the jurisdiction's current requirements, not the ones in force when the building was approved."],
   ["margin","How far a measurement sits from the threshold it is judged against, rather than simply which side of it landed. Three decibels short is a very different conversation from thirty."],
   ["donor antenna","The rooftop antenna that talks to the public-safety tower. Everything indoors depends on this one link."],
   ["retransmission authorization","The frequency holder's written permission to rebroadcast its channels inside a building. Without it there is nothing lawful to amplify, whatever the fire marshal says."],
   ["frequency holder","The public-safety agency that actually holds the radio licence — often a county or a statewide network. It owns the channels a building's system rebroadcasts."],
   ["integrator","The firm that designs, installs, tests and maintains the system. The owner is responsible for compliance; the integrator is who does the work."],
   ["waiver","A fire marshal's written record that a building was accepted without meeting the coverage criteria. It does not expire, it binds whoever holds the office next, and only a change to the building reopens it."],
   ["as-built","The record of what was actually installed, which is rarely exactly what was drawn. Filed after installation and before the acceptance test."],
   ["vesting","The moment a project's rulebook is fixed. Approval of the design settles which edition of the code the job is measured against, even if the county changes its rules later."],
   ["program","Everything a jurisdiction has configured for itself — the code edition it adopted, its technical requirements, and what it asks to be filed. Every project in that jurisdiction is measured against it."],
   ["maintenance and monitoring agreement","The contract keeping a system serviced for its lifetime. The code requires an active one at all times, but contracts run one, three or five years — so they have to be renewed, and a gap is a real state."],
   ["remote shutdown","The one control here that changes something in the physical world: it takes a system off the air. Both the fire marshal and the frequency holder hold it."],
   ["approved tester","Where a jurisdiction requires one, an independent testing firm — independent of the integrator, and on the jurisdiction's approved list. Many jurisdictions require no such thing."],
   ["part-approved","A project where some buildings have been approved and others have not. It is a normal resting state on a campus, not a problem to be cleared."],
   ["channel group","One public-safety network a building is tested against. A building on three networks is graded three times, separately, and must pass all of them."],
   ["dBm","The unit signal strength is measured in. It runs negative, and less negative is stronger: &minus;85 dBm is a better signal than &minus;95 dBm."],
   ["NT","Not tested. A square of the building grid carrying no measurement — neither a pass nor a fail, and worth knowing about rather than assuming."],
   ["solicitation","An outstanding request waiting on a named party. Everything that looks like a stalled project is really one of these, unanswered."],
   ["owner of record","The party legally responsible for a building's compliance. They delegate the work to an integrator but never the responsibility, which is why they are told directly when something lapses."]
  ];

  var pop = null;
  function close(){ if(pop){ pop.remove(); pop = null; } }
  function open(el, term, def){
    close();
    pop = document.createElement('div');
    pop.className = 'um-pop';
    pop.innerHTML = '<button class="um-x" aria-label="Close">&times;</button><b></b><div class="um-body"></div>';
    pop.querySelector('b').textContent = term;
    pop.querySelector('.um-body').innerHTML = def;
    pop.querySelector('.um-x').addEventListener('click', close);
    document.body.appendChild(pop);
    var r = el.getBoundingClientRect();
    var w = pop.offsetWidth, h = pop.offsetHeight;
    var left = Math.min(Math.max(8, r.left), (document.documentElement.clientWidth || 800) - w - 8);
    var top = r.bottom + 7;
    if(top + h > (document.documentElement.clientHeight || 600) - 8) top = Math.max(8, r.top - h - 7);
    pop.style.left = left + 'px'; pop.style.top = top + 'px';
  }
  document.addEventListener('click', function(e){
    var d = e.target.closest ? e.target.closest('.um-def') : null;
    if(d){ e.stopPropagation(); open(d, d.dataset.t, d.dataset.d); return; }
    if(!e.target.closest || !e.target.closest('.um-pop')) close();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') close();
    if((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('um-def')){
      e.preventDefault(); open(e.target, e.target.dataset.t, e.target.dataset.d);
    }
  });
  addEventListener('scroll', close, true);
  addEventListener('resize', close);

  var SKIP = {SCRIPT:1,STYLE:1,TEXTAREA:1,TITLE:1,OPTION:1,SELECT:1,SVG:1,svg:1,TEMPLATE:1};
  function decorate(){
    if(termsOff()) return;
    var done = {};
    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
      acceptNode: function(n){
        if(!n.nodeValue || n.nodeValue.length < 3) return NodeFilter.FILTER_REJECT;
        for(var p = n.parentNode; p && p !== document.body; p = p.parentNode){

        }

    });
    var texts = [], t;
    while((t = walker.nextNode())) texts.push(t);

    for(var i=0;i<texts.length;i++){
      var node = texts[i];
      for(var j=0;j<TERMS.length;j++){
        var term = TERMS[j][0];
        if(done[term]) continue;
        var re = new RegExp('(^|[^A-Za-z-])(' + term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')(?![A-Za-z-])',

        var span = document.createElement('span');
        span.className = 'um-def'; span.tabIndex = 0;
        span.setAttribute('role','button');
        span.dataset.t = term; span.dataset.d = TERMS[j][1];
        span.title = 'What this means';
        var after = node.splitText(start);
        after.splitText(m[2].length);
        span.textContent = after.nodeValue;
        after.parentNode.replaceChild(span, after);
        done[term] = 1;
        break;
      }
    }
  }

  function boot(){ sweep(); decorate(); }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);

  setTimeout(boot, 400);

})();
</script>

/* ---------- rail ---------- */
.rail{position:sticky;top:70px}
@media(max-width:900px){.rail{position:static}}
.rcard{background:var(--surface);border:1px solid var(--rule);border-radius:3px;overflow:hidden;
  margin-bottom:16px}
.rcard h3{font-family:var(--display);font-weight:400;font-size:16.5px;margin:0;padding:13px 15px;
  border-bottom:1px solid var(--rule);background:var(--surface-2)}
.rbody{font-variant-numeric:tabular-nums;padding:13px 15px;font-size:14.5px}
.rbody p{margin:0 0 9px}

.donor .d{color:var(--ink-2);font-size:13px;display:block;margin-top:1px}
.noverdict{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3);border-top:1px solid var(--rule);padding-top:9px;margin-top:9px;display:block}
.cons{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:9px 0;
  border-bottom:1px solid var(--rule)}
.cons:last-child{border-bottom:0}
.cons .tag{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  border-radius:3px;padding:2px 6px;white-space:nowrap;flex:none;margin-top:2px;
  color:var(--plum);border:1px solid var(--plum);background:var(--plum-bg)}
.ask{background:var(--amber-bg);border:1px solid var(--amber-rule);border-radius:3px;padding:14px 16px}
.ask h3{font-family:var(--display);font-weight:400;font-size:16.5px;margin:0 0 9px;padding:0;border:0;background:none}
.ask ol{margin:0;padding-left:19px;font-size:14.5px}
.ask li{margin-bottom:9px}
.ask li:last-child{margin-bottom:0}
.upload{display:flex;align-items:center;gap:9px;border:1px dashed var(--rule-strong);
  border-radius:3px;padding:10px 12px;margin:0 0 12px;font-size:14.5px;color:var(--ink-2);
  background:var(--surface-2);cursor:pointer}
.upload span{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.hard{display:block;border-top:1px solid var(--amber-rule);margin-top:11px;padding-top:10px;
  font-size:13px;color:var(--ink-2)}
.reasonbox{border:1px solid var(--teal);border-radius:3px;margin:0 15px 15px;overflow:hidden}
.reasonbox .rh{background:var(--teal-bg);border-bottom:1px solid var(--teal);padding:11px 13px}
.reasonbox .rh b{font-family:var(--display);font-weight:400;font-size:16.5px;display:block}
.reasonbox .rh span{font-size:13px;color:var(--ink-2)}
.reasonbox .rbdy{padding:12px 13px}
.reasonbox textarea{width:100%;font:inherit;font-size:14.5px;color:var(--ink);
  background:var(--surface);border:1px solid var(--rule-strong);border-radius:3px;
  padding:9px 10px;min-height:74px;resize:vertical}
.reasonbox .rfoot{font-size:13px;color:var(--ink-2);margin-top:8px}
.occ{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  border-radius:3px;padding:2px 6px;white-space:nowrap;display:inline-block;margin-top:5px}
.occ.yes{color:var(--teal);border:1px solid var(--teal);background:var(--teal-bg)}
.occ.no{color:var(--amber);border:1px solid var(--amber);background:var(--amber-bg)}
.ask li.done{color:var(--ink-2)}
.ask li.done b{color:var(--ink)}
.settled{display:block;background:var(--teal-bg);border-left:3px solid var(--teal);
  border-radius:3px;padding:9px 11px;margin:0 0 11px;font-size:13px}
.ask b{font-weight:600}

footer{margin-top:32px;padding-top:18px;border-top:1px solid var(--rule);
  color:var(--ink-2);font-size:13px;max-width:76ch}
footer b{color:var(--ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<div class="proto">Prototype &mdash; invented projects, invented dates. Built to be marked up, not used.</div>

<div class="wrap">

<div class="cols">

  <div class="rail" id="rail"></div>
</div>
</div>

<script>
/* ------------------------------------------------------------------ *
 * Three cases of one screen. Everything here is invented except the
 * rules it demonstrates, which come from Rob.
 * ------------------------------------------------------------------ */

const CASES = [
{
  id:"fayetteville",
  crumb:"City of Raleigh &middot; Fire Department &nbsp;/&nbsp; Project review",
  title:"400 Fayetteville Street",
  parties:[["Owner","Fayetteville Street Holdings LLC"],["Integrator","Carolina Life Safety Systems"],
           ["Stage","2 &middot; Determination"]],

  docs:[{
    t:"Benchmark Test Report", m:"Filed 2026-08-14 by Carolina Life Safety Systems",
    rows:[["Test performed","2026-08-11"],["General areas passed","92.0%  (46 of 50 grid squares)"],
          ["Critical areas passed","97.5%  (39 of 40 points)"],["Delivered audio quality","3.5 DAQ"],
          ["Channel group","VIPER &mdash; Wake Simulcast"],["Transmitter tested against","Site 118 &mdash; Raleigh North"],
          ["Instrument","PCTEL SeeHawk Touch, s/n 4471"],["Instrument calibration","valid to 2026-11-02"]]
  }],
  file:{n:"Benchmark_400Fayetteville_2026-08-11.pdf", p:18, s:"2.4 MB",
        d:"Filed 2026-08-14 by Carolina Life Safety Systems", h:"8c31d0a7&hellip;4f7a"},
  reqs:[
    {b:"code",lab:"95% of general areas",cite:"IFC &sect;510.4.1 (2021)",meas:"measured <span class='under'>92.0%</span> &mdash; 3.0 points short"},
    {b:"code",lab:"99% of critical areas",cite:"IFC &sect;510.4.1 (2021)",meas:"measured <span class='under'>97.5%</span> &mdash; 1.5 points short",
     why:"Which document to cite beside this figure is still open &mdash; a report can print a threshold its jurisdiction never adopted."},
    {b:"lfh",lab:"Minimum delivered audio quality 3.4 DAQ",cite:"VIPER technical criteria 2026.2",meas:"measured <span class='over'>3.5 DAQ</span> &mdash; met"},
    {b:"ahj",lab:"This jurisdiction keeps the fire code official&rsquo;s discretion",cite:"IFC &sect;510.1 Exception 2",
     meas:"kept &mdash; so stage 2 here is a judgment, not a calculation",
     why:"Some jurisdictions delete this exception. Where it is deleted, missing the criteria settles the matter and there is nothing left to weigh."}
  ],
  opts:[
    {k:"req",t:"A system is required",d:"The project proceeds to design. The criteria bind from here on."},
    {k:"not",t:"No system is required",d:"The project stops. Because this building missed the code&rsquo;s criteria, a waiver is drafted by this jurisdiction's attorney and stored here.",warn:true},
    {k:"ask",t:"Ask VIPER before deciding",d:"Sends the benchmark and the tower loading to the frequency holder and waits. Consultation, not approval &mdash; the decision stays with this jurisdiction."}
  ],
  waiverOn:"not",
  reasonOn:true,
  rail:"donor"
},
{
  id:"duke",
  crumb:"City of Raleigh &middot; Fire Department &nbsp;/&nbsp; Project review",
  title:"Duke Health &mdash; Erwin Road Campus",
  parties:[["Owner","Duke University Health System"],["Integrator","Piedmont Communications Group"],
           ["Stage","4 &middot; Design"]],
  vested:"Vested under Program v1.0 &middot; in force since 2026-03-01",
  partial:true,
  buildings:[
    {nm:"Ardmore Tower",meta:"Design package &middot; PDF and iBwave file received",state:"ok",label:"Approved 2026-08-08",occ:["yes","Occupancy issued"]},
    {nm:"Clinic South",meta:"Design package &middot; PDF and iBwave file received",state:"ok",label:"Approved 2026-08-08",occ:["yes","Occupancy issued"]},
    {nm:"Research Annex",meta:"Design package &middot; PDF received, iBwave file not received",state:"open",label:"Not yet decided",occ:["no","Occupancy withheld"]}
  ],
  docs:[{
    t:"Design package &mdash; Research Annex", m:"Filed 2026-08-09 by Piedmont Communications Group",
    rows:[["Design PDF","received &middot; 34 pages &middot; born-digital"],["iBwave design file","not received"],
          ["Donor site proposed","Site 118 &mdash; Raleigh North"],["Amplifier","Class B, 33 dBm downlink"],
          ["Battery backup","24 hours"],["Survivability pathway","2-hour rated"]],
  }],
  reqs:[
    {b:"code",lab:"Two-hour survivability for the pathway",cite:"IFC &sect;510.4.2.2 (2021)",meas:"stated in the design &mdash; 2-hour rated"},
    {b:"code",lab:"24-hour standby battery",cite:"IFC &sect;510.4.2.3 (2021)",meas:"stated in the design &mdash; 24 hours"},
    {b:"lfh",lab:"Donor isolation at least system gain + 20 dB",cite:"VIPER technical criteria 2026.2",
     meas:"not stated in the PDF",
     why:"Best practice rather than code, so the program sets it. It is one of the values the iBwave file would carry and the printout does not."},
    {b:"ahj",lab:"Donor site must be on the permitted list",cite:"Program v1.0 &sect;2",meas:"Site 118 &mdash; on the list"}
  ],
  opts:[
    {k:"appr",t:"Approve Research Annex",d:"The third building joins the two already approved and the project completes stage 4."},
    {k:"ret",t:"Return Research Annex to the integrator",d:"Names what is missing and waits. The two approvals already given stand and are not reopened.",warn:true},
    {k:"hold",t:"Leave it undecided for now",d:"The project stays part-approved. Nothing is overdue &mdash; there is no clock on this."}
  ],
  rail:"cons"
},
{
  id:"convention",
  crumb:"City of Raleigh &middot; Fire Department &nbsp;/&nbsp; Project review",
  title:"Raleigh Convention Center",
  parties:[["Owner","City of Raleigh"],["Integrator","Carolina Life Safety Systems"],
           ["Stage","6 &middot; Acceptance"]],
  vested:"Vested under Program v1.0 &middot; in force since 2026-03-01",
  buildings:[{nm:"Raleigh Convention Center",meta:"System required at stage 2 on 2026-01-19 &middot; installed 2026-07-02",state:"open",label:"Awaiting acceptance"}],
  docs:[{
    t:"Acceptance Test Report", m:"Filed 2026-07-24 by Carolina Life Safety Systems",
    rows:[["Test performed","2026-07-18"],["General areas passed","94.0%  (188 of 200 grid squares)"],
          ["Critical areas passed","99.2%  (124 of 125 points)"],["Delivered audio quality","3.6 DAQ"],
          ["Channel group","VIPER &mdash; Wake Simulcast"],["Transmitter tested against","Site 118 &mdash; Raleigh North"],
          ["Instrument","PCTEL SeeHawk Touch, s/n 2210"],["Instrument calibration","expired 2026-05-30"]],
  }],
  reqs:[
    {b:"code",lab:"95% of general areas",cite:"IFC &sect;510.4.1 (2021)",meas:"measured <span class='under'>94.0%</span> &mdash; 1.0 point short"},
    {b:"code",lab:"99% of critical areas",cite:"IFC &sect;510.4.1 (2021)",meas:"measured <span class='over'>99.2%</span> &mdash; met"},
    {b:"lfh",lab:"Minimum delivered audio quality 3.4 DAQ",cite:"VIPER technical criteria 2026.2",meas:"measured <span class='over'>3.6 DAQ</span> &mdash; met"}
  ],
  opts:[
    {k:"acc",t:"Accept the system",d:"Closes stage 6. The project completes and passes to the ERCES Integrator, which carries annual testing and the maintenance agreement from here."},
    {k:"rej",t:"Not accepted &mdash; fix and retest",d:"Names the shortfall and returns it. The system is corrected and a new acceptance test is submitted.",warn:true},
    {k:"waive",t:"Accept it short, with a waiver",d:"Not available at stage 6. The discretion was spent at stage 2 &mdash; a system that was required and does not meet the criteria is fixed, not excused.",barred:true}
  ],
  rail:"handoff"
}
];

const RAILS = {
donor:`<div class="rcard"><h3>About This Tower</h3><div class="rbody">
  <div class="donor"><span class="n">11</span><span><b>Donor antennas already point at Site 118</b>
    <span class="d">Counted from coverage reports already in the vault &mdash; every report names the transmitter it was tested against.</span></span></div>
  <div class="donor"><span class="n">6</span><span><b>Of them within two miles of this building</b>
    <span class="d">Ravenscroft Plaza, One Glenwood, Wake Tech Building C, Dorothea Dix Ops, Glenwood South Residences, Lenovo Center.</span></span></div>
  <div class="donor"><span class="n">2</span><span><b>Added in the last twelve months</b>
    <span class="d">Both accepted at stage 6 in that period.</span></span></div>
</div></div>`,

cons:`<div class="rcard"><h3>Who Else is on This Stage</h3><div class="rbody">
  <div class="cons"><span class="tag">approval</span><span><b>The Authority Having Jurisdiction</b> &mdash; the design package, per building.</span></div>
  <div class="cons"><span class="tag">approval</span><span><b>VIPER</b> &mdash; the frequency holder approves the design too, on its own track. Ardmore Tower and Clinic South cleared it on 2026-08-06.</span></div>
</div></div>
<div class="rcard"><h3>Where This Project has Been</h3><div class="rbody">
  <p><b>Stage 1</b> &middot; Benchmark filed 2026-04-02 &mdash; three buildings, all short.</p>
  <p><b>Stage 2</b> &middot; System required, all three, 2026-04-21.</p>
  <p><b>Stage 3</b> &middot; VIPER authorised retransmission 2026-06-11.</p>
  <p><b>Stage 4</b> &middot; Here. Two approved, one open.</p>
</div></div>`,

handoff:``
};

const ASK = `<div class="ask"><h3>All four answered &mdash; 2026-08-21</h3><ol>
<li class="done"><b>The waiver.</b> <i>&ldquo;Nothing exists today. Every jurisdiction will create
their own&hellip; drafted by outside legal, and we will just store it.&rdquo;</i> So we never write
the wording and never hold a template. What is left is the trigger, the routing and the record.</li>
<li class="done"><b>Stage 2 records a reason.</b> <i>&ldquo;A reason should be given and filed for
reference.&rdquo;</i> The code asks for no record at all, so this is ours &mdash; for whoever reads
the file in five years.</li>
<li class="done"><b>Donor antennas &mdash; tabled.</b> <i>&ldquo;There&rsquo;s no set number, and
it&rsquo;s within a given range of all the donor antennas.&rdquo;</i> The panel now leads with range
rather than a count on one tower. How to record it so it can raise an alert comes later, by your
call.</li>
<li class="done"><b>Part-approved, and why.</b> <i>&ldquo;The AHJ would approve two of the three
buildings for occupancy&hellip; and just not issue occupancy for the building that has not passed
yet.&rdquo;</i> This one went further than the question &mdash; see below.</li>
</ol></div>
<div class="ask" style="margin-top:16px"><h3>What occupancy opened up</h3><ol>
<li><b>Which stage actually gates it?</b> You were answering about the <b>design</b> at stage 4, but
occupancy sounds like the end of the job &mdash; the acceptance test at stage 6. Is it one gate, or
does every stage from 4 onward hold the doors shut?</li>
<li><b>Is it your certificate?</b> In a lot of places the building department issues occupancy and
the AHJ signs off as one input among many. Do you issue it, or hand up a sign-off to
somebody who does?</li>
<li><b>Is there a temporary version</b> &mdash; a TCO with a condition and a deadline to fix the
radio coverage? If so, that would be the first thing on this whole map with a deadline attached.</li>
</ol></div>`;

let cur = 0;
const picks = {};
const $ = id => document.getElementById(id);

function render(){
  const c = CASES[cur];
  document.querySelectorAll(".casebtn").forEach(b =>
    b.classList.toggle("on", +b.dataset.case === cur));

  $("crumb").innerHTML = c.crumb;
  $("ptitle").innerHTML = c.title + (c.partial ? ' <span class="partial">part-approved</span>' : '');
  $("psub").innerHTML = c.sub || "";
  $("parties").innerHTML = c.parties.map(p =>
    '<span class="vtag">' + p[0] + ': ' + p[1] + '</span>').join("") +
    '<span class="vtag vest">' + c.vested + '</span>';

  let h = "";

  /* buildings */
  h += sec("The Buildings in This Project", c.buildings.length + (c.buildings.length===1?" building":" buildings"),
    c.buildings.map(b =>
      '<div class="brow"><span class="bdot ' + b.state + '"></span><span class="bmain">' +
      '<span class="bnm">' + b.nm + '</span><span class="bmeta">' + b.meta + '</span>' +
      (b.occ ? '<span class="occ ' + b.occ[0] + '">' + b.occ[1] + '</span>' : '') + '</span>' +
      '<span class="bstate ' + b.state + '">' + b.label + '</span></div>').join(""));

  /* documents */
  h += sec("What was Submitted", "",
    c.docs.map(d => {
      let s = '<div class="doc"><div class="dhead"><span class="dt">' + d.t +
        '</span><span class="dm">' + d.m + '</span></div><div class="readout">' +
        d.rows.map(r => '<div class="rl"><span class="k">' + r[0] + '</span><span class="v">' +
          r[1] + '</span></div>').join("") + '</div>';
      if (d.missing) s += '<div class="missing"><b>' + d.missing[0] + '</b>' + d.missing[1] + '</div>';
      if (d.fact) s += '<div class="factbox"><span class="fl">' + d.fact[0] + '</span>' +
        '<span class="fs">' + d.fact[1] + '</span><span class="fw">' + d.fact[2] + '</span></div>';
      return s + '</div>';
    }).join(""));

  /* the report itself */
  if (c.file){
    h += sec("The Report Itself", "held as filed",
      '<div class="doc">' +
        '<div class="glyph">PDF</div>' +
        '<div class="what">' +
          '<div class="nm">' + c.file.n + '</div>' +
          '<div class="meta">' + c.file.p + ' pages &middot; ' + c.file.s + ' &middot; ' +
            c.file.d + '</div>' +
          '<div class="hash">SHA-256 ' + c.file.h +
            ' &mdash; kept as received, never rewritten</div>' +
          '<div class="acts">' +
            '<button class="btn ghost" type="button" disabled>Open the report</button>' +
            '<span class="small">Placeholder &mdash; the file itself is not part of this ' +
            'prototype.</span>' +
          '</div>' +
        '</div>' +
      '</div>');
  }

  /* decision */
  const pick = picks[c.id];
  let dec = '<div class="decide">' + (c.notice ?
    '<div class="dnotice"><b>' + c.notice[0] + '</b><p>' + c.notice[1] + '</p></div>' : '') +
    '<div class="opts">' + c.opts.map(o =>
      '<label class="opt' + (pick===o.k ? " picked" + (o.warn?" warnpick":"") : "") + (o.barred?" barred":"") + '">' +
      '<input type="radio" name="dec" value="' + o.k + '"' + (pick===o.k?" checked":"") +
      (o.barred?" disabled":"") + '>' +
      '<span><span class="ot">' + o.t + '</span><span class="od">' + o.d + '</span></span></label>').join("") +
    '</div>';
  if (c.reasonOn && pick && pick !== "ask") dec += reason(pick);
  if (c.waiverOn && pick === c.waiverOn) dec += waiver();
  const res = pick ? outcome(c, pick) : "Nothing is selected, and nothing here has been worked out.";
  if (res) dec += '<div class="result' + (pick?"":" none") + '">' + res + '</div>';
  dec += '</div>';
  h += sec("The Decision", c.parties[2][1], dec, true);

  $("main").innerHTML = h;
  $("rail").innerHTML = RAILS[c.rail] + ASK;

  $("main").querySelectorAll('input[name=dec]').forEach(r =>
    r.addEventListener("change", e => { picks[c.id] = e.target.value; render(); }));
}

function sec(title, num, body, raw){
  return '<section><div class="shead"><h2>' + title + '</h2><span class="snum">' + num +
    '</span></div><div class="sbody"' + (raw ? ' style="padding:15px 15px"' : '') + '>' + body + '</div></section>';
}

function reason(pick){
  const said = pick === "req"
    ? "Why a system is required here."
    : "Why this building is being let off.";
  return '<div class="reasonbox"><div class="rh"><b>The reason, filed for reference</b>' +
   '<span>' + said + ' The code does not ask for this &mdash; the platform does.</span></div>' +
   '<div class="rbdy"><textarea placeholder="In the jurisdiction&rsquo;s own words. Nobody is grading it."></textarea>' +
   '</div></div>';
}

function waiver(){
  return '<div class="waiver"><div class="whead"><b>A waiver is written and sent out</b>' +
   '<span>A building that does not meet the code&rsquo;s criteria is being accepted. That gets written down.</span></div>' +
   '<div class="wbody">' +
   '<div class="wrecip"><span class="r">Integrator</span><span class="r">Owner</span>' +
   '<span class="r peer">VIPER &mdash; frequency holder</span></div>' +
   '<div class="upload">&#128206; Attach the signed waiver <span>PDF from this jurisdiction</span></div>' +
   '</div></div>';
}

function outcome(c, k){
  const M = {
   req:"Recorded: <b>a system is required at 400 Fayetteville Street</b>, decided by this jurisdiction on 2026-08-20. The project moves to design and the criteria bind from here.",
   ask:"Sent to VIPER on 2026-08-20 with the benchmark and the tower loading. It appears in the queue as <b>waiting on someone else</b>. The determination stays open and stays with this jurisdiction.",
   appr:"Recorded: <b>Research Annex approved</b> on 2026-08-20. All three buildings are now approved and the project completes stage 4.",
   ret:"Returned to Piedmont Communications Group on 2026-08-20, naming the missing iBwave file. Ardmore Tower and Clinic South stay approved. The project remains open and part-approved.",
   hold:"Nothing recorded. The project stays part-approved with two of three buildings decided, and it will sit here until it is picked up again.",
   acc:"Recorded: <b>accepted</b> on 2026-08-20, with the shortfall on general areas stated in the record. The project completes and passes to the ERCES Integrator.",
   rej:"Recorded: <b>not accepted</b> on 2026-08-20 &mdash; 94.0% against a required 95.0%. Returned for correction and a new acceptance test."
  };
  return M[k] || "";

<script>
(function(){
  // Review chrome is identified by how a block OPENS, not by any mention anywhere -
  // "Facts only. No verdict." and "Who holds this project now" are product copy that
  // happens to sit near a dated citation, and blanket matching removed them.
  // Review chrome is identified by how a block OPENS, not by any mention anywhere -
  // "Facts only. No verdict." and "Who holds this project now" are product copy that
  // happens to sit near a dated citation.
  var HEAD = /^(settled|marked up|all four answered|what we (still )?need from you|what occupancy opened up|four questions|everything on this screen is answered|where these come from placeholder|open\s*(&mdash;|—|-)\s*not drawn here|\d+\s*[·.]\s)/i;
  var REVIEWY = /\byou (said|wrote|asked for)\b|your (words|position)\b|\bwe (may have|picked|guessed)\b|unrefuted|tabled|still a slot|phase one, exactly/i;
  var CITE = [
    /\b(Your words|Your position|You said|You wrote|Rob said|Rob:|Rob,)[^.!?]*[.!?]\s*/gi,
    /\bSettled\b[^.!?]*[.!?]\s*/gi,
    /\bMarked up\b[^.!?]*[.!?]\s*/gi
  ];
  var sweeping = false;
  var txtOf = function(el){ return (el.textContent || '').replace(/\s+/g, ' ').trim(); };

  // A screen may opt out of the inline glossary underlines - the program screen does, because
  // its own heading is the jargon. The words stay in the glossary panel; they lose the marking.
  function termsOff(){ return !!document.querySelector('[data-um="no-inline-terms"]'); }

  function decite(el){
    var hit = false, w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null), ns = [], n;
    while((n = w.nextNode())) ns.push(n);
    ns.forEach(function(t){
      var before = t.nodeValue, after = before;
      CITE.forEach(function(re){ after = after.replace(re, ''); });
      if(after !== before){ t.nodeValue = after; hit = true; }
    });
    if(hit){
      el.querySelectorAll('em,i,blockquote').forEach(function(q){
        if(/^["“‘']/.test((q.textContent || '').trim())) q.remove();
      });
      if(!txtOf(el)) el.remove();
    }
    return hit;
  }

  // A note box is a note box however true its contents. The useful ones keep their
  // words but lose the callout: they become a quiet info chip you open if you want it.
  function toChip(el){
    if(termsOff()){ el.remove(); return; }
    var head = el.querySelector('strong,b,h4');
    var label = head ? txtOf(head).replace(/[.:—-]\s*$/, '') : 'About this';
    var body = el.innerHTML;
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'um-chip um-def';
    chip.dataset.t = label;
    chip.dataset.d = body;
    chip.textContent = label;
    el.parentNode.replaceChild(chip, el);
  }

  function sweep(){
    if(sweeping) return; sweeping = true;
    try{
      document.querySelectorAll('.proto,.ask,.askbox,.lineage').forEach(function(el){ el.remove(); });
      document.querySelectorAll('.rcard,.corr').forEach(function(el){
        if(HEAD.test(txtOf(el)) || REVIEWY.test(txtOf(el))) el.remove(); else decite(el);
      });
      document.querySelectorAll('.note').forEach(function(el){
        var t = txtOf(el);
        if(HEAD.test(t) || REVIEWY.test(t)){ el.remove(); return; }
        decite(el);
        if(el.parentNode && txtOf(el)) toChip(el);
      });
      document.querySelectorAll('.rail').forEach(function(r){
        if(!r.querySelector('*')){
          r.style.display = 'none';
          var c = r.closest ? r.closest('.cols') : null;
          if(c) c.style.gridTemplateColumns = 'minmax(0,1fr)';
        }
      });
    } finally { sweeping = false; }
  }

  var TERMS = [
   ["ERCES","Emergency Responder Communication Enhancement System. Equipment installed in a building so firefighters and police keep radio coverage inside it — thick walls and basements are where ordinary portable radios fail."],
   ["BDA","Bi-Directional Amplifier. The box at the heart of most systems: it takes the public-safety signal from outside, amplifies it, and rebroadcasts it indoors — and back out again."],
   ["AHJ","Authority Having Jurisdiction — in practice the fire marshal or fire code official. The party that decides whether a building needs a system and whether the finished one is acceptable."],
   ["benchmark test","A radio survey of the building as it stands today, before anything is installed. It is the evidence the fire marshal weighs when deciding whether a system is needed at all."],
   ["acceptance test","The radio survey of the finished, installed system. Same measurements as the benchmark, taken to prove the system does what the design promised."],
   ["annual test","The recurring test an owner owes every year for as long as the system exists. It is graded against the jurisdiction's current requirements, not the ones in force when the building was approved."],
   ["margin","How far a measurement sits from the threshold it is judged against, rather than simply which side of it landed. Three decibels short is a very different conversation from thirty."],
   ["donor antenna","The rooftop antenna that talks to the public-safety tower. Everything indoors depends on this one link."],
   ["retransmission authorization","The frequency holder's written permission to rebroadcast its channels inside a building. Without it there is nothing lawful to amplify, whatever the fire marshal says."],
   ["frequency holder","The public-safety agency that actually holds the radio licence — often a county or a statewide network. It owns the channels a building's system rebroadcasts."],
   ["integrator","The firm that designs, installs, tests and maintains the system. The owner is responsible for compliance; the integrator is who does the work."],
   ["waiver","A fire marshal's written record that a building was accepted without meeting the coverage criteria. It does not expire, it binds whoever holds the office next, and only a change to the building reopens it."],
   ["as-built","The record of what was actually installed, which is rarely exactly what was drawn. Filed after installation and before the acceptance test."],
   ["vesting","The moment a project's rulebook is fixed. Approval of the design settles which edition of the code the job is measured against, even if the county changes its rules later."],
   ["program","Everything a jurisdiction has configured for itself — the code edition it adopted, its technical requirements, and what it asks to be filed. Every project in that jurisdiction is measured against it."],
   ["maintenance and monitoring agreement","The contract keeping a system serviced for its lifetime. The code requires an active one at all times, but contracts run one, three or five years — so they have to be renewed, and a gap is a real state."],
   ["remote shutdown","The one control here that changes something in the physical world: it takes a system off the air. Both the fire marshal and the frequency holder hold it."],
   ["approved tester","Where a jurisdiction requires one, an independent testing firm — independent of the integrator, and on the jurisdiction's approved list. Many jurisdictions require no such thing."],
   ["part-approved","A project where some buildings have been approved and others have not. It is a normal resting state on a campus, not a problem to be cleared."],
   ["channel group","One public-safety network a building is tested against. A building on three networks is graded three times, separately, and must pass all of them."],
   ["dBm","The unit signal strength is measured in. It runs negative, and less negative is stronger: &minus;85 dBm is a better signal than &minus;95 dBm."],
   ["NT","Not tested. A square of the building grid carrying no measurement — neither a pass nor a fail, and worth knowing about rather than assuming."],
   ["solicitation","An outstanding request waiting on a named party. Everything that looks like a stalled project is really one of these, unanswered."],
   ["owner of record","The party legally responsible for a building's compliance. They delegate the work to an integrator but never the responsibility, which is why they are told directly when something lapses."]
  ];

  var pop = null;
  function close(){ if(pop){ pop.remove(); pop = null; } }
  function open(el, term, def){
    close();
    pop = document.createElement('div');
    pop.className = 'um-pop';
    pop.innerHTML = '<button class="um-x" aria-label="Close">&times;</button><b></b><div class="um-body"></div>';
    pop.querySelector('b').textContent = term;
    pop.querySelector('.um-body').innerHTML = def;
    pop.querySelector('.um-x').addEventListener('click', close);
    document.body.appendChild(pop);
    var r = el.getBoundingClientRect();
    var w = pop.offsetWidth, h = pop.offsetHeight;
    var left = Math.min(Math.max(8, r.left), (document.documentElement.clientWidth || 800) - w - 8);
    var top = r.bottom + 7;
    if(top + h > (document.documentElement.clientHeight || 600) - 8) top = Math.max(8, r.top - h - 7);
    pop.style.left = left + 'px'; pop.style.top = top + 'px';
  }
  document.addEventListener('click', function(e){
    var d = e.target.closest ? e.target.closest('.um-def') : null;
    if(d){ e.stopPropagation(); open(d, d.dataset.t, d.dataset.d); return; }
    if(!e.target.closest || !e.target.closest('.um-pop')) close();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') close();
    if((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('um-def')){
      e.preventDefault(); open(e.target, e.target.dataset.t, e.target.dataset.d);
    }
  });
  addEventListener('scroll', close, true);
  addEventListener('resize', close);

  var SKIP = {SCRIPT:1,STYLE:1,TEXTAREA:1,TITLE:1,OPTION:1,SELECT:1,SVG:1,svg:1,TEMPLATE:1};
  function decorate(){
    if(termsOff()) return;
    var done = {};
    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
      acceptNode: function(n){
        if(!n.nodeValue || n.nodeValue.length < 3) return NodeFilter.FILTER_REJECT;

    for(var i=0;i<texts.length;i++){
      var node = texts[i];
      for(var j=0;j<TERMS.length;j++){
        var term = TERMS[j][0];
        if(done[term]) continue;
        var re = new RegExp('(^|[^A-Za-z-])(' + term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')(?![A-Za-z-])',
                            term === term.toUpperCase() ? '' : 'i');
        var m = re.exec(node.nodeValue);
        if(!m) continue;
        var start = m.index + m[1].length;
        var span = document.createElement('span');
        span.className = 'um-def'; span.tabIndex = 0;
        span.setAttribute('role','button');
        span.dataset.t = term; span.dataset.d = TERMS[j][1];
        span.title = 'What this means';
        var after = node.splitText(start);
        after.splitText(m[2].length);
        span.textContent = after.nodeValue;
        after.parentNode.replaceChild(span, after);
        done[term] = 1;
        break;
      }
    }
  }

  function boot(){ sweep(); decorate(); }

})();
</script>
