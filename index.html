<script>
/* ------------------------------------------------------------------
   Thresholds are the three graded metrics. Margin is the MINIMUM
   normalised margin across all three, never power alone — ranking by
   power picks the wrong worst area. See coverage-map-geometry.md.
   ------------------------------------------------------------------ */
const TH = {power:-95.0, snr:20.0, fber:2.0};
const SPAN = {power:20.0, snr:20.0, fber:2.0};   // our normalising spans — see the rail
const LABEL = {power:"DL power", snr:"DL S/N", fber:"DL FBER"};
const UNIT  = {power:"dB", snr:"dB", fber:"pp"};

function margins(a){
  return {power:a.power - TH.power, snr:a.snr - TH.snr, fber:TH.fber - a.fber};
}
function assess(a){
  const m = margins(a);
  let bind = "power", best = Infinity;
  for (const k of ["power","snr","fber"]){
    const n = m[k] / SPAN[k];
    if (n < best){ best = n; bind = k; }
  }
  return {m:m, norm:best, bind:bind, pass:m.power>=0 && m.snr>=0 && m.fber>=0};
}

/* --- the invented floor: a deterministic field, then four overrides --- */
function field(cols, rows, riserC, riserR, fails){
  const out = [];
  for (let r=0; r<rows; r++) for (let c=0; c<cols; c++){
    const n = r*cols + c + 1;
    const d = Math.hypot((c-riserC)*1.0, (r-riserR)*1.9);
    const j = ((Math.sin(n*12.9898)*43758.5453) % 1 + 1) % 1;   // stable pseudo-jitter
    out.push({n:n, power:-58.4 - 3.55*d - j*3.2, snr:34.2 - 1.18*d - j*1.4, fber:0});
  }
  for (const f of fails){ const a = out[f.n-1]; a.power = f.power; a.snr = f.snr; a.fber = f.fber||0; }
  return out;
}

const CLUSTER = [{n:31,power:-96.4,snr:22.1},{n:32,power:-97.8,snr:21.3},
                 {n:41,power:-98.9,snr:19.4},{n:42,power:-96.1,snr:20.8}];
const SCATTER = [{n:7,power:-96.2,snr:21.7},{n:24,power:-97.1,snr:20.4},
                 {n:38,power:-98.4,snr:19.6},{n:45,power:-96.0,snr:22.3},
                 // this floor's weak corner is not weak — the four failures are the whole story
                 {n:31,power:-84.1,snr:26.9},{n:32,power:-82.6,snr:27.4},
                 {n:41,power:-85.7,snr:26.1},{n:42,power:-83.3,snr:27.0}];

/* --- the report in full: Wrenfield, page 5, 5 x 4 row-major --- */
const DUBLIN = [
 [-67.97,31.58,0.00],[-68.27,31.91,0.00],[-68.46,31.40,0.00],[-68.08,32.18,0.45],[-64.75,31.79,0.00],
 [-73.64,31.35,0.00],[-66.14,31.72,0.00],[-70.03,31.24,0.00],[-65.25,31.86,0.00],[-64.19,31.48,0.00],
 [-78.31,32.00,0.00],[-68.52,31.82,0.00],[-77.00,30.92,0.00],[-66.68,31.83,0.00],[-70.60,31.55,0.00],
 [-68.42,31.71,0.00],[-70.92,31.42,0.00],[-72.52,31.65,0.00],[-72.44,31.91,0.00],[-71.57,31.72,0.00]
].map((v,i) => ({n:i+1, power:v[0], snr:v[1], fber:v[2]}));

const CASES = [
{
 id:"cluster", cols:10, rows:5, cw:14.8, ch:9.4,
 crumb:"City of Raleigh &middot; Fire Department &nbsp;/&nbsp; Benchmark test report",
 ttl:"400 Fayetteville Street &mdash; 3rd floor",
 tags:[["Filed","2026-08-14 by Carolina Life Safety Systems"],["Channel","VIPER &mdash; Wake Simulcast"],
       ["Transmitter","Site 118 &mdash; Raleigh North"]],
 verdict:["fail","46 / 50 areas &middot; 92.0% against 95%"],
 file:{n:"Benchmark_400Fayetteville_3rdFloor_2026-08-14.pdf", p:22, s:"3.1 MB",
       d:"Filed 2026-08-14 by Carolina Life Safety Systems", h:"4a91c2d8&hellip;e07b"},
 areas: field(10,5,7.5,1.2,CLUSTER), riser:[7.5,1.2],
 checks:[["ok","All 50 recovered cells floor-match the report&rsquo;s own table",
   "The grid detected on the floor-plan image was checked against the measured table on page 5. Every cell agreed. This check is free, and it is what shows the drawing is not making anything up."],
  ["ok","Grid geometry agrees with the report&rsquo;s stated area size to 0.3%",
   "The report says each area is 14.8 ft &times; 9.4 ft. The grid found measures 14.75 &times; 9.43. Two independent ways of getting the same number."]],
},
{
 id:"scatter", cols:10, rows:5, cw:14.8, ch:9.4,
 crumb:"City of Raleigh &middot; Fire Department &nbsp;/&nbsp; Benchmark test report",
 ttl:"Two Hannover Square &mdash; 6th floor",
 tags:[["Filed","2026-08-09 by Piedmont Communications Group"],["Channel","VIPER &mdash; Wake Simulcast"],
       ["Transmitter","Site 118 &mdash; Raleigh North"]],
 verdict:["fail","46 / 50 areas &middot; 92.0% against 95%"],
 file:{n:"Benchmark_TwoHannoverSquare_6thFloor_2026-08-09.pdf", p:19, s:"2.6 MB",
       d:"Filed 2026-08-09 by Piedmont Communications Group", h:"7d38bac1&hellip;91c4"},
 areas: field(10,5,7.5,1.2,SCATTER), riser:[7.5,1.2],
 checks:[["ok","All 50 recovered cells floor-match the report&rsquo;s own table",
   "Same self-check as the other report, same result."],
  ["warn","Four isolated failures, each surrounded by areas with room to spare",
   "Stated as a fact, with nothing read into it. It could be four local obstructions, four lift lobbies, four measurement artefacts, or four real holes. The platform does not know which, and does not guess."]],
},
{
 id:"dublin", cols:5, rows:4, cw:16.32, ch:7.31,
 crumb:"City of Marston, Ohio &nbsp;/&nbsp; Benchmark test report &mdash; read in full",
 ttl:"Wrenfield Hospital, Suite 325",
 tags:[["Tested","2023-11-29 by Lakeview RF Compliance"],["Technician","Dale Marchetti"],
       ["Channel","3 &middot; 855.4875 MHz &middot; COIRS South Simulcast"]],
 verdict:["pass","20 / 20 areas &middot; 100%"],
 file:{n:"2023-11-29-lakeview-wrenfield-suite-325-coverage-test.pdf",
       p:7, s:"668 KB", d:"Tested 2023-11-29 by Lakeview RF Compliance",
       h:"10015e3d&hellip;4d90"},
 areas: DUBLIN, riser:null,
 checks:[["ok","20 of 20 recovered cells floor-match the report&rsquo;s DL Power column",
   "The grid detected on the page-3 image gives 20 cells in 5 columns and 4 rows. Each holds exactly one plotted value, and all twenty equal the whole-number part of the measured table on page 5, in reading order."],
  ["ok","Cell size agrees with the report to 0.26%",
   "Page 4 states 16.32 ft &times; 7.31 ft. The detected grid measures 2.2268 wide-to-tall against the report&rsquo;s 2.2326."]],
}];

let cur = 0, sel = null, byPF = false;
const $ = id => document.getElementById(id);
const esc = s => String(s);

function ramp(v){                       // v = normalised margin
  if (v < 0) return {cls:"bad", a:Math.min(.92, .40 + Math.min(-v,1)*.55)};
  return {cls:"good", a:Math.max(.07, Math.min(.72, .72 - v*.62))};
}
function pfRamp(pass){ return pass ? {cls:"good", a:.30} : {cls:"bad", a:.85}; }

function render(){
  const c = CASES[cur];
  document.querySelectorAll(".casebtn").forEach(b => b.classList.toggle("on", +b.dataset.case === cur));
  $("crumb").innerHTML = c.crumb;
  $("ttl").innerHTML = c.ttl;
  $("sub").innerHTML = c.sub || "";
  $("parties").innerHTML = c.tags.map(t => '<span class="vtag">' + t[0] + ': ' + t[1] + '</span>').join("") +
    '<span class="vtag ' + c.verdict[0] + '">' + c.verdict[1] + '</span>';

  const rows = c.areas.map(a => Object.assign({a:a}, assess(a)));
  const failed = rows.filter(r => !r.pass).length;

  let h = "";

  /* the report itself */
  if (c.file){
    h += sec("The Report Itself", "held as filed",
      '<div class="doc">' +
        '<div class="glyph">PDF</div>' +
        '<div class="what">' +
          '<div class="nm">' + c.file.n + '</div>' +
          '<div class="meta">' + c.file.p + ' pages &middot; ' + c.file.s + ' &middot; ' +
            c.file.d + '</div>' +
          '<div class="hash">SHA-256 ' + c.file.h +
            ' &mdash; kept as received, never rewritten</div>' +
          '<div class="acts">' +
            '<button class="btn ghost" type="button" disabled>Open the report</button>' +
            '<span class="small">Placeholder &mdash; the file itself is not part of this ' +
            'prototype.</span>' +
          '</div>' +
        '</div>' +
      '</div>');
  }


  /* ---- the floor ---- */
  const W = 980, pad = 34;
  const cellW = (W - pad*2) / c.cols, cellH = cellW * (c.ch / c.cw);
  const H = cellH * c.rows + pad*2;
  let svg = '<svg viewBox="0 0 ' + W + ' ' + Math.round(H) + '" role="img" aria-label="Coverage grid">';
  rows.forEach(r => {
    const i = r.a.n - 1, cx = i % c.cols, cy = Math.floor(i / c.cols);
    const x = pad + cx*cellW, y = pad + cy*cellH;
    const g = byPF ? pfRamp(r.pass) : ramp(r.norm);
    svg += '<rect class="cell ' + g.cls + (sel === r.a.n ? ' sel' : '') + '" style="--a:' + g.a.toFixed(3) +
      '" data-n="' + r.a.n + '" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' +
      cellW.toFixed(1) + '" height="' + cellH.toFixed(1) + '"><title>Area ' + r.a.n + ' — ' +
      LABEL[r.bind] + ' ' + (r.m[r.bind] >= 0 ? '+' : '') + r.m[r.bind].toFixed(2) + ' ' + UNIT[r.bind] +
      '</title></rect>';
    svg += '<text class="cn" x="' + (x+7).toFixed(1) + '" y="' + (y+16).toFixed(1) + '">' + r.a.n + '</text>';
    svg += '<text class="cv" x="' + (x+cellW-7).toFixed(1) + '" y="' + (y+cellH-8).toFixed(1) +
      '" text-anchor="end">' + (r.m[r.bind] >= 0 ? '+' : '') + r.m[r.bind].toFixed(1) + '</text>';
  });
  if (c.riser){
    const rx = pad + c.riser[0]*cellW, ry = pad + c.riser[1]*cellH;
    svg += '<circle class="riser" cx="' + rx.toFixed(1) + '" cy="' + ry.toFixed(1) + '" r="15"/>';
    svg += '<text class="riserlab" x="' + (rx+21).toFixed(1) + '" y="' + (ry+4).toFixed(1) + '">riser</text>';
  }
  svg += '<text class="dim" x="' + pad + '" y="' + (pad-12) + '">' +
    (c.cols*c.cw).toFixed(0) + ' ft &#215; ' + (c.rows*c.ch).toFixed(0) + ' ft &middot; ' +
    c.cols + ' &#215; ' + c.rows + ' areas of ' + c.cw + ' &#215; ' + c.ch + ' ft</text>';
  svg += '</svg>';

  const legend = byPF
    ? '<div class="legend"><span class="ramp"><span class="lb">Pass / fail</span>' +
      '<i style="background:rgb(var(--heat-good)/.30)"></i><i style="background:rgb(var(--heat-bad)/.85)"></i></span>' +
      '</div>'
    : '<div class="legend"><span class="ramp"><span class="lb">Margin</span>' +
      [-.9,-.4,0,.15,.35,.6,.9].map(v => { const g = ramp(v);
        return '<i style="background:rgb(var(--heat-' + (g.cls === "bad" ? "bad" : "good") + ')/' + g.a.toFixed(2) + ')"></i>'; }).join("") +
      '<span class="rb">below &rarr; comfortable</span></span>' +
      '</div>';

  h += sec("The Floor", failed ? failed + " of " + rows.length + " areas out of spec" : "all " + rows.length + " areas in spec",
    '<div class="plan">' + svg + '</div>' + legend);

  /* ---- ranked ---- */
  const ranked = rows.slice().sort((a,b) => a.norm - b.norm);
  const show = ranked.slice(0, 14);
  const maxAbs = Math.max(1, ...ranked.map(r => Math.abs(r.norm)));
  h += sec("Worst Areas First", "the same data with no floor plan",
    '<div class="bars">' + show.map(r => {
      const w = Math.abs(r.norm) / maxAbs * 50;
      const left = r.norm < 0 ? (50 - w) : 50;
      return '<div class="bar' + (sel === r.a.n ? ' sel' : '') + '" data-n="' + r.a.n + '" tabindex="0">' +
        '<span class="id">' + r.a.n + '</span>' +
        '<span class="track"><span class="zero" style="left:50%"></span>' +
        '<span class="fill ' + (r.norm < 0 ? 'bad' : 'good') + '" style="left:' + left.toFixed(2) +
        '%;width:' + w.toFixed(2) + '%"></span></span>' +
        '<span class="met">' + LABEL[r.bind] + '</span>' +
        '<span class="val ' + (r.norm < 0 ? 'bad' : 'good') + '">' +
        (r.m[r.bind] >= 0 ? '+' : '') + r.m[r.bind].toFixed(2) + ' ' + UNIT[r.bind] + '</span></div>';
    }).join("") + '</div>' +
    (ranked.length > show.length ? '<p class="more">' + (ranked.length - show.length) +
      ' more areas, all with more room than these.</p>' : ''));

  $("main").innerHTML = h;
  $("rail").innerHTML = detail(rows) + ASK;

  $("main").querySelectorAll("[data-n]").forEach(el => {
    const go = () => { sel = (sel === +el.dataset.n) ? null : +el.dataset.n; render(); };
    el.addEventListener("click", go);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); go(); } });
  });
}

function sec(title, num, body){
  return '<section><div class="shead"><h2>' + title + '</h2><span class="snum">' + num +
    '</span></div><div class="sbody">' + body + '</div></section>';
}

function detail(rows){
  if (sel === null) return '';
  const r = rows.find(x => x.a.n === sel);
  const line = k => '<div class="mrow' + (r.bind === k ? ' bind' : '') + '"><span class="k">' + LABEL[k] +
    '</span><span class="v">' + (k === "fber" ? r.a[k].toFixed(2) + ' %' : r.a[k].toFixed(2) + ' ' + (k === "power" ? "dBm" : "dB")) +
    '</span><span class="v">' + (r.m[k] >= 0 ? '+' : '') + r.m[k].toFixed(2) + ' ' + UNIT[k] + '</span></div>';
  return '<div class="rcard"><h3>Area ' + sel + '</h3><div class="rbody">' +
    '<p style="margin-bottom:11px">' + (r.pass
      ? 'In spec on all three. Its thinnest margin is on <b>' + LABEL[r.bind] + '</b>.'
      : '<b>Out of spec.</b> The metric that puts it there is <b>' + LABEL[r.bind] + '</b>.') + '</p>' +
    line("power") + line("snr") + line("fber") +
    '<p style="margin-top:11px;font-size:13px;color:var(--ink-2)">Binding metric <span class="bindtag">' +
    LABEL[r.bind] + '</span> &mdash; the one with the least room once the three are put on a common scale. ' +
    'It is named on screen because <b>ranking by signal strength alone picks the wrong worst area</b>.</p>' +
    '</div></div>';
}

function method(){
  return '<div class="rcard"><h3>How &ldquo;Margin&rdquo; is Worked out</h3><div class="rbody">' +
   '<p>Three things are graded, in three different units. A single colour needs one number, so they have to be made comparable first.</p>' +
   '<div class="formula">DL power &minus; (&minus;95.0 dBm) &divide; 20 dB<br>' +
   'DL S/N &minus; 20.0 dB &divide; 20 dB<br>' +
   '2.0 % &minus; DL FBER &divide; 2.0 pp<br>' +
   '<b>margin = the smallest of the three</b></div>' +
   '<p>On this report it matters: <b>area 11</b> is weakest on signal strength, but has among the most room on signal-to-noise. <b>Area 13</b> is mid-pack on strength and worst overall. Colour by strength alone and the map is confidently wrong about which area is worst.</p>' +
   '<span class="ours"><b>The three divisors are the platform&rsquo;s, not the code&rsquo;s.</b> The thresholds are code; how much room counts as &ldquo;comfortable&rdquo; on each metric is a judgement made so the three could share one scale. Different divisors would re-order the map.</span>' +
   '</div></div>';
}

const ASK = '<div class="ask"><h3>What we need from you</h3><ol>' +
 '<li><b>Is the margin rule right?</b> Turn on <i>colour by pass / fail</i> in the bar at the top and watch the floor go flat &mdash; that is what a summary shows you. The margin version needs the three metrics on one scale, and <b>we picked the divisors</b>. Is &ldquo;worst of the three&rdquo; how you would read it, and are 20 dB / 20 dB / 2 pp sane?</li>' +
 '<li><b>Original and retest.</b> A building fails, gets fixed, gets tested again. Do you want the two floors <b>side by side on this screen</b>, or one report that remembers its earlier version?</li>' +
 '<li><b>What if they only have a scan?</b> Everything here was read out of the file. From a photograph of paper we could still show the picture, but not the numbers under it &mdash; no margins, no ranking, no self-check. How often will a submitter genuinely have nothing better?</li>' +
 '<li><b>PCTEL already has this data.</b> SeeHawk Central holds the grid as structured data, before it ever becomes a PDF, and already does AHJ review and approval. We are recovering from a picture what they never lost. What is left for us &mdash; and would you rather we read their export than their printout?</li>' +
 '</ol></div>';

document.querySelectorAll(".casebtn").forEach(b =>
  b.addEventListener("click", () => { cur = +b.dataset.case; sel = null; render(); window.scrollTo(0,0); }));
$("pf").addEventListener("change", e => { byPF = e.target.checked; render(); });
render();
</script>

<script>
(function(){
  // Review chrome is identified by how a block OPENS, not by any mention anywhere -
  // "Facts only. No verdict." and "Who holds this project now" are product copy that
  // happens to sit near a dated citation, and blanket matching removed them.
  // Review chrome is identified by how a block OPENS, not by any mention anywhere -
  // "Facts only. No verdict." and "Who holds this project now" are product copy that
  // happens to sit near a dated citation.
  var HEAD = /^(settled|marked up|all four answered|what we (still )?need from you|what occupancy opened up|four questions|everything on this screen is answered|where these come from placeholder|open\s*(&mdash;|—|-)\s*not drawn here|\d+\s*[·.]\s)/i;
  var REVIEWY = /\byou (said|wrote|asked for)\b|your (words|position)\b|\bwe (may have|picked|guessed)\b|unrefuted|tabled|still a slot|phase one, exactly/i;

<div class="rail">

  <div class="rcard">
    <h3>Where These Come From</h3>
    <div class="rbody">
      <div class="slot">
        <b>Placeholder &mdash; Rob, 10 Sep 2026.</b><br>
        Buildings reach this list <b>two ways, and only two</b>: an integrator opens a project, or
        your permit system tells us an application was filed. The second one is an
        <b>API connection to your permit software</b>, and it is not built.
        <div style="margin-top:9px">
          <button class="btn" disabled>Connect your permit system</button>
          <span class="fact">nothing is connected</span>
        </div>
      </div>
      <p class="fact" style="white-space:normal;margin:11px 0 0"><b>What crosses the wire is the
      permit number.</b> It is a <em>cross-reference</em> &mdash; your number, kept beside our
      project so you can find one from the other. It is never what identifies the building.
      &#9888; A number on its own does not give us the address or the applicant, and this screen
      needs both &mdash; so either more comes across, or the number is how we read the rest. That is
      still open.</p>
    </div>
  </div>

  <div class="rcard">
    <h3>Tell Me When Work Should Have Started</h3>
    <div class="rbody">
      <div class="slot">
        <b>Still a slot &mdash; but no longer an empty one.</b><br>
        We now have <b>one</b> real signal: the permit application. It tells us a building exists
        and roughly what it is. What it does not tell us is <b>when</b> &mdash; it lands when the
        paperwork is filed, and stage 1 is pinned to <b>enclosure</b>, walls up and windows in,
        which can be a year later and which nothing reports.
        <div style="margin-top:9px">
          <button class="btn" disabled>Alert me at enclosure</button>
          <span class="fact">the permit gives us the building, not the moment</span>
        </div>
      </div>
      <p class="fact" style="white-space:normal;margin:11px 0 0">Meanwhile you can mark a building
      as under construction yourself &mdash; open one below and use <em>Mark under construction</em>.
      Whether that hand-mark is the answer or a stopgap is question 5.</p>
    </div>
  </div>

  <div class="rcard">
    <h3>Settled with Rob &mdash; 9 Sep 2026</h3>
    <div class="rbody">
      <p style="margin:0 0 10px"><b>A building with no address is described, not coded.</b> The AHJ
      writes a description, and it will most likely be <em>the project name the developer
      provided</em> &mdash; the name the people building it already use.</p>
      <p style="margin:0 0 10px"><b>The AHJ decides a duplicate, and resolves it by deleting its own.</b>
      The integrator keeps working with the record it created; the AHJ's is the thinner one, so the
      AHJ removes it. No merge, no automatic match, nobody else's call.</p>
      <p style="margin:0 0 10px"><b>The building and the watching are two things.</b> A building
      record holds facts about the building and is shared. A <em>watch</em> is the AHJ's own
      attachment to it &mdash; why, since when, hand-marks, who was contacted &mdash; and is the
      AHJ's alone. So a duplicate is only ever a duplicate <em>record</em>: it goes, and the watch
      re-points to the survivor. Nothing merges, nothing leaks, nothing is lost.</p>
      <p style="margin:0 0 10px"><b>The map is the screen.</b> The list stays, but the map is what
      opens.</p>
      <p style="margin:0 0 10px"><b>Buildings arrive from the jurisdiction's permit system, and
      nothing else.</b> The AHJ does not go looking &mdash; not with its own eyes, not through tax
      or parcel records. The platform is <b>integrated with the third-party permit system</b> and is
      notified <b>when an application is filed &mdash; not when a permit is issued</b>, which is the
      earliest moment there is anything to see. The record brings the applicant with it, which is
      who to contact. <b>Adding one by hand survives</b> for the case nothing comes through.</p>
      <p style="margin:0 0 10px"><b>So this list is speculative, deliberately.</b> Flagging at
      application means some of these buildings will never be built. Nothing removes them by itself
      &mdash; the platform never chases &mdash; so <em>Stop watching</em> is the only exit, and it is
      yours to press.</p>
      <p style="margin:0 0 10px"><b>All fifteen statuses stay</b> &mdash; twelve derived, three marked
      by hand. Rob was asked to cut the list and kept every one: <em>"keep them all."</em> The
      <em>"et cetera"</em> he ended on in August is closed.</p>
      <p style="margin:0"><b>The two kinds of status are right, and a hand-mark is never chased.</b>
      What we derive from filings and what the AHJ marks by hand stay separate &mdash; and the
      platform never expires a hand-mark, never asks whether it is still true, and never nags. It
      is the AHJ's own note and stands until the AHJ changes it.</p>
    </div>
  </div>

  <div class="ask">
    <h3>Everything on this screen is answered</h3>
    <ol>
      <li><b>The map is the screen.</b> The list stays as the second view.</li>
      <li><b>All fifteen statuses stay</b> &mdash; twelve we derive, three you mark. Rob was asked to

      <li><b>The split is right and a hand-mark is never chased.</b> Derived status comes from what
        has been filed; hand-marks stand until the AHJ changes them.</li>
      <li><b>A building with no address is described</b>, usually by the developer's project name.</li>
      <li><b>Duplicates: the AHJ decides and drops its own record</b>, and its watch re-points to the
        survivor.</li>
      <li><b>Buildings arrive from the permit system, at application.</b> Adding by hand survives as
        the exception.</li>
    </ol>
    <div class="rbody" style="border-top:1px solid var(--rule)">
      <b>Still open, and not on this screen:</b> how the permit application actually reaches us

var $ = function(id){return document.getElementById(id)};
var view = "map", filt = "all", sel = null;

function today(){ return new Date("2026-08-28T12:00:00"); }
function days(d){
  return Math.round((today() - new Date(d + "T12:00:00")) / 86400000);
}
function ago(d){
  var n = days(d);
  return n === 0 ? "today" : n === 1 ? "yesterday" : n + " days ago";
}
function nice(d){
  var m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var p = d.split("-");
  return (+p[2]) + " " + m[+p[1]-1] + " " + p[0];
}
function shown(){
  return B.filter(function(b){
    if(filt === "all") return true;
    if(filt === "permit") return b.o === "permit";
    if(filt === "hand") return b.o === "hand";
    return ST[b.st].g === filt;
  });
}

function chip(b){
  return '<span class="chip ' + ST[b.st].c + '">' + ST[b.st].t + '</span>';
}
function marks(b){
  return b.marks.map(function(m){ return '<span class="mark">' + m + '</span>'; }).join("");
}
function mine(b){ return b.o !== "int"; }
function origin(b){
  if(b.o === "permit")
    return '<span class="origin">Building permit application</span><span class="fact">' +
      b.pm.ref + ' &middot; ' + ago(b.added) + '</span>';
  if(b.o === "hand")
    return '<span class="origin">Added by hand</span><span class="fact">' +
      ago(b.added) + ' &mdash; no permit behind it</span>';
  return '<span class="origin">An integrator started a project</span><span class="fact">' +
    ago(b.added) + ' &mdash; how the project was found</span>';
}

function drawPins(){
  var g = $("pins"), vis = shown(), out = "";
  B.forEach(function(b){
    var on = vis.indexOf(b) > -1;
    if(!on) return;
    var col = PINC[ST[b.st].g];
    out += '<g class="pin' + (sel === b.id ? ' sel' : '') + '" data-id="' + b.id + '" tabindex="0">' +
      '<circle class="halo" cx="' + b.x + '" cy="' + b.y + '" r="13"/>' +
      '<circle class="dot" cx="' + b.x + '" cy="' + b.y + '" r="7" fill="' + col + '"' +
      (mine(b) ? ' stroke-dasharray="2.2 2.2"' : '') + '/>' +
      '<title>' + b.a + ' — ' + ST[b.st].t.replace(/&amp;/g,"&") + '</title>' +
      '</g>';
  });
  g.innerHTML = out;
  Array.prototype.forEach.call(g.querySelectorAll(".pin"), function(p){
    p.addEventListener("click", function(){ pick(+p.dataset.id); });
    p.addEventListener("keydown", function(e){
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(+p.dataset.id); }
    });
  });
}

  out += '<span><span class="swatch" style="background:var(--teal)"></span>A project is running</span>';

  out += '<span style="color:var(--ink-3)">Dotted edge = added by hand. Solid = created by an integrator.</span>';
  $("legend").innerHTML = out;
}

function drawRows(){
  var vis = shown();

    return '<tr class="row' + (sel === b.id ? ' sel' : '') + '" data-id="' + b.id + '">' +
      '<td class="addr">' + b.a + '<small>' + (b.n || "") + '</small></td>' +
      '<td>' + chip(b) + '<div>' + marks(b) + '</div></td>' +
      '<td>' + origin(b) + '</td>' +
      '<td>' + (b.last
        ? nice(b.last) + '<span class="fact">' + ago(b.last) + '</span>'
        : '<span class="empty">Nothing has been filed</span><span class="fact">added ' +
          ago(b.added) + '</span>') + '</td>' +
      '</tr>';
  }).join("");
  Array.prototype.forEach.call($("rows").querySelectorAll("tr.row"), function(r){
    r.addEventListener("click", function(){ pick(+r.dataset.id); });
  });
  $("listcount").textContent = vis.length + " of " + B.length;
  $("count").textContent = vis.length + " shown";
}

function drawDetail(){
  var sec = $("sec-detail");
  if(sel === null){
    if(sec) sec.hidden = true;
    return;
  }
  if(sec) sec.hidden = false;
  var b = B.filter(function(x){ return x.id === sel; })[0];
  $("dtitle").innerHTML = b.a;
  $("dsub").innerHTML = b.o === "permit" ? "FROM A BUILDING PERMIT APPLICATION"
    : b.o === "hand" ? "ADDED BY HAND" : "AN INTEGRATOR CREATED IT";

  var h = '<dl class="dgrid">';
  h += '<dt>Status</dt><dd>' + chip(b) + ' ' + marks(b) + '</dd>';
  h += '<dt>What it is</dt><dd>' + (b.n || '<span class="empty">not recorded</span>') + '</dd>';
  h += '<dt>Owner</dt><dd>' + (b.own.n || '<span class="empty">unknown</span>') +
       (b.own.e ? '<br><span class="fact">' + b.own.e +
          (b.pm ? ' &middot; from the permit application' : '') + '</span>'
                : '<br><span class="fact">no way to reach them recorded</span>') + '</dd>';
  h += '<dt>On the list since</dt><dd>' + nice(b.added) + ' <span class="fact">&middot; ' +
       ago(b.added) + '</span></dd>';
  h += '<dt>Last filing</dt><dd>' + (b.last
      ? nice(b.last) + ' <span class="fact">&middot; ' + ago(b.last) + '</span>'
      : '<span class="empty">nothing has ever been filed</span>') + '</dd>';
  if(b.pm)
    h += '<dt>Permit application</dt><dd>' + b.pm.ref + ' &mdash; ' + b.pm.what +
      '<br><span class="fact">applicant: ' + b.pm.who + '</span></dd>';
  if(mine(b))
    h += '<dt>The watch</dt><dd>' + (b.why || '<span class="empty">no reason recorded</span>') +
      '<br><span class="fact">This jurisdiction&rsquo;s alone. No integrator ever sees it.</span></dd>';
  if(b.marks.length)
    h += '<dt>Marked by hand</dt><dd>' + marks(b) +
      '<br><span class="fact">Stands until this jurisdiction changes it. The platform never ' +
      'expires it and never asks whether it is still true.</span></dd>';
  else if(b.why) h += '<dt>Note</dt><dd>' + b.why + '</dd>';
  h += '</dl>';

  h += '<ul class="tl">' + b.tl.map(function(e){
    return '<li><span class="when">' + nice(e[0]) + '</span><b>' + e[1] + '</b>' +
      (e[2] ? '<br>' + e[2] : '') + '</li>';
  }).join("") + '</ul>';

  if(b.dup){
    var o = B.filter(function(x){ return x.id === b.dup; })[0];
    var ours = mine(b) ? b : o, theirs = mine(b) ? o : b;
    h += '<div class="warn"><b>This may be the same building as another record.</b><br>' +
      '&ldquo;' + b.a + '&rdquo; and &ldquo;' + o.a + '&rdquo; were entered separately &mdash; ' +
      'one came from this jurisdiction ' + ago(ours.added) + ', the other was created by an integrator ' + ago(theirs.added) +

  $("dbody").innerHTML = h;

<script>
(function(){
  // Review chrome is identified by how a block OPENS, not by any mention anywhere -
  // "Facts only. No verdict." and "Who holds this project now" are product copy that
  // happens to sit near a dated citation, and blanket matching removed them.
  // Review chrome is identified by how a block OPENS, not by any mention anywhere -
  // "Facts only. No verdict." and "Who holds this project now" are product copy that
  // happens to sit near a dated citation.
  var HEAD = /^(settled|marked up|all four answered|what we (still )?need from you|what occupancy opened up|four questions|everything on this screen is answered|where these come from placeholder|open\s*(&mdash;|—|-)\s*not drawn here|\d+\s*[·.]\s)/i;
  var REVIEWY = /\byou (said|wrote|asked for)\b|your (words|position)\b|\bwe (may have|picked|guessed)\b|unrefuted|tabled|still a slot|phase one, exactly/i;
  var CITE = [
    /\b(Your words|Your position|You said|You wrote|Rob said|Rob:|Rob,)[^.!?]*[.!?]\s*/gi,
    /\bSettled\b[^.!?]*[.!?]\s*/gi,
    /\bMarked up\b[^.!?]*[.!?]\s*/gi
  ];
  var sweeping = false;
  var txtOf = function(el){ return (el.textContent || '').replace(/\s+/g, ' ').trim(); };

  // A screen may opt out of the inline glossary underlines - the program screen does, because
  // its own heading is the jargon. The words stay in the glossary panel; they lose the marking.
  function termsOff(){ return !!document.querySelector('[data-um="no-inline-terms"]'); }

  function decite(el){
    var hit = false, w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null), ns = [], n;
    while((n = w.nextNode())) ns.push(n);
    ns.forEach(function(t){
      var before = t.nodeValue, after = before;
      CITE.forEach(function(re){ after = after.replace(re, ''); });
      if(after !== before){ t.nodeValue = after; hit = true; }
    });
    if(hit){
      el.querySelectorAll('em,i,blockquote').forEach(function(q){
        if(/^["“‘']/.test((q.textContent || '').trim())) q.remove();
      });
      if(!txtOf(el)) el.remove();
    }
    return hit;
  }

  // A note box is a note box however true its contents. The useful ones keep their
  // words but lose the callout: they become a quiet info chip you open if you want it.
  function toChip(el){
    if(termsOff()){ el.remove(); return; }
    var head = el.querySelector('strong,b,h4');
    var label = head ? txtOf(head).replace(/[.:—-]\s*$/, '') : 'About this';
    var body = el.innerHTML;
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'um-chip um-def';
    chip.dataset.t = label;
    chip.dataset.d = body;
    chip.textContent = label;
    el.parentNode.replaceChild(chip, el);
  }

  function sweep(){
    if(sweeping) return; sweeping = true;
    try{
      document.querySelectorAll('.proto,.ask,.askbox,.lineage').forEach(function(el){ el.remove(); });
      document.querySelectorAll('.rcard,.corr').forEach(function(el){
        if(HEAD.test(txtOf(el)) || REVIEWY.test(txtOf(el))) el.remove(); else decite(el);
      });
      document.querySelectorAll('.note').forEach(function(el){
        var t = txtOf(el);
        if(HEAD.test(t) || REVIEWY.test(t)){ el.remove(); return; }
        decite(el);
        if(el.parentNode && txtOf(el)) toChip(el);
      });
      document.querySelectorAll('.rail').forEach(function(r){
        if(!r.querySelector('*')){
          r.style.display = 'none';
          var c = r.closest ? r.closest('.cols') : null;
          if(c) c.style.gridTemplateColumns = 'minmax(0,1fr)';
        }
      });
    } finally { sweeping = false; }
  }

  var TERMS = [
   ["ERCES","Emergency Responder Communication Enhancement System. Equipment installed in a building so firefighters and police keep radio coverage inside it — thick walls and basements are where ordinary portable radios fail."],
   ["BDA","Bi-Directional Amplifier. The box at the heart of most systems: it takes the public-safety signal from outside, amplifies it, and rebroadcasts it indoors — and back out again."],
   ["AHJ","Authority Having Jurisdiction — in practice the fire marshal or fire code official. The party that decides whether a building needs a system and whether the finished one is acceptable."],
   ["benchmark test","A radio survey of the building as it stands today, before anything is installed. It is the evidence the fire marshal weighs when deciding whether a system is needed at all."],
   ["acceptance test","The radio survey of the finished, installed system. Same measurements as the benchmark, taken to prove the system does what the design promised."],
   ["annual test","The recurring test an owner owes every year for as long as the system exists. It is graded against the jurisdiction's current requirements, not the ones in force when the building was approved."],
   ["margin","How far a measurement sits from the threshold it is judged against, rather than simply which side of it landed. Three decibels short is a very different conversation from thirty."],
   ["donor antenna","The rooftop antenna that talks to the public-safety tower. Everything indoors depends on this one link."],
   ["retransmission authorization","The frequency holder's written permission to rebroadcast its channels inside a building. Without it there is nothing lawful to amplify, whatever the fire marshal says."],
   ["frequency holder","The public-safety agency that actually holds the radio licence — often a county or a statewide network. It owns the channels a building's system rebroadcasts."],
   ["integrator","The firm that designs, installs, tests and maintains the system. The owner is responsible for compliance; the integrator is who does the work."],
   ["waiver","A fire marshal's written record that a building was accepted without meeting the coverage criteria. It does not expire, it binds whoever holds the office next, and only a change to the building reopens it."],
   ["as-built","The record of what was actually installed, which is rarely exactly what was drawn. Filed after installation and before the acceptance test."],
   ["vesting","The moment a project's rulebook is fixed. Approval of the design settles which edition of the code the job is measured against, even if the county changes its rules later."],
   ["program","Everything a jurisdiction has configured for itself — the code edition it adopted, its technical requirements, and what it asks to be filed. Every project in that jurisdiction is measured against it."],
   ["maintenance and monitoring agreement","The contract keeping a system serviced for its lifetime. The code requires an active one at all times, but contracts run one, three or five years — so they have to be renewed, and a gap is a real state."],
   ["remote shutdown","The one control here that changes something in the physical world: it takes a system off the air. Both the fire marshal and the frequency holder hold it."],
   ["approved tester","Where a jurisdiction requires one, an independent testing firm — independent of the integrator, and on the jurisdiction's approved list. Many jurisdictions require no such thing."],
   ["part-approved","A project where some buildings have been approved and others have not. It is a normal resting state on a campus, not a problem to be cleared."],
   ["channel group","One public-safety network a building is tested against. A building on three networks is graded three times, separately, and must pass all of them."],
   ["dBm","The unit signal strength is measured in. It runs negative, and less negative is stronger: &minus;85 dBm is a better signal than &minus;95 dBm."],
   ["NT","Not tested. A square of the building grid carrying no measurement — neither a pass nor a fail, and worth knowing about rather than assuming."],
   ["solicitation","An outstanding request waiting on a named party. Everything that looks like a stalled project is really one of these, unanswered."],
   ["owner of record","The party legally responsible for a building's compliance. They delegate the work to an integrator but never the responsibility, which is why they are told directly when something lapses."]
  ];

  var pop = null;
  function close(){ if(pop){ pop.remove(); pop = null; } }
  function open(el, term, def){
    close();
    pop = document.createElement('div');
    pop.className = 'um-pop';
    pop.innerHTML = '<button class="um-x" aria-label="Close">&times;</button><b></b><div class="um-body"></div>';
    pop.querySelector('b').textContent = term;
    pop.querySelector('.um-body').innerHTML = def;
    pop.querySelector('.um-x').addEventListener('click', close);
    document.body.appendChild(pop);
    var r = el.getBoundingClientRect();
    var w = pop.offsetWidth, h = pop.offsetHeight;
    var left = Math.min(Math.max(8, r.left), (document.documentElement.clientWidth || 800) - w - 8);
    var top = r.bottom + 7;
    if(top + h > (document.documentElement.clientHeight || 600) - 8) top = Math.max(8, r.top - h - 7);
    pop.style.left = left + 'px'; pop.style.top = top + 'px';
  }
  document.addEventListener('click', function(e){
    var d = e.target.closest ? e.target.closest('.um-def') : null;
    if(d){ e.stopPropagation(); open(d, d.dataset.t, d.dataset.d); return; }
    if(!e.target.closest || !e.target.closest('.um-pop')) close();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') close();
    if((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('um-def')){
      e.preventDefault(); open(e.target, e.target.dataset.t, e.target.dataset.d);
    }
  });
  addEventListener('scroll', close, true);
  addEventListener('resize', close);

  var SKIP = {SCRIPT:1,STYLE:1,TEXTAREA:1,TITLE:1,OPTION:1,SELECT:1,SVG:1,svg:1,TEMPLATE:1};
  function decorate(){
    if(termsOff()) return;
    var done = {};
    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
      acceptNode: function(n){
        if(!n.nodeValue || n.nodeValue.length < 3) return NodeFilter.FILTER_REJECT;
        for(var p = n.parentNode; p && p !== document.body; p = p.parentNode){
          if(SKIP[p.nodeName] || (p.classList && p.classList.contains('um-def'))) return NodeFilter.FILTER_REJECT;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var texts = [], t;
    while((t = walker.nextNode())) texts.push(t);

    for(var i=0;i<texts.length;i++){
      var node = texts[i];
      for(var j=0;j<TERMS.length;j++){
        var term = TERMS[j][0];
        if(done[term]) continue;
        var re = new RegExp('(^|[^A-Za-z-])(' + term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')(?![A-Za-z-])',
                            term === term.toUpperCase() ? '' : 'i');
        var m = re.exec(node.nodeValue);
        if(!m) continue;
        var start = m.index + m[1].length;
        var span = document.createElement('span');
        span.className = 'um-def'; span.tabIndex = 0;
        span.setAttribute('role','button');
        span.dataset.t = term; span.dataset.d = TERMS[j][1];
        span.title = 'What this means';
        var after = node.splitText(start);
        after.splitText(m[2].length);
        span.textContent = after.nodeValue;
        after.parentNode.replaceChild(span, after);
        done[term] = 1;
        break;
      }
    }
  }

  function boot(){ sweep(); decorate(); }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
  setTimeout(boot, 400);
  setTimeout(sweep, 1200);
  new MutationObserver(function(){ sweep(); }).observe(document.documentElement, {childList:true, subtree:true});
})();
</script>

function $(id){ return document.getElementById(id); }

    if(apFilt === "waiting") return r.state === "waiting";
    if(apFilt === "decided") return r.state !== "waiting";
    return true;
  });
}

function drawApprovals(){
  var rows = apList(), html = "";
  rows.forEach(function(r){
    var s = sysOf(r.s), t = towOf(s.t), d = DEC[r.state];
    html += '<tr class="row' + (apSel === r.id ? " on" : "") + '" data-r="' + r.id + '">' +
      "<td><strong>" + esc(s.b) + "</strong><br><span class=\"small\">" + esc(s.own) + "</span></td>" +

          "value below came off the retransmission form.</p>" +
          '<dl class="facts">' +
            "<dt>Donor Site</dt><dd>" + esc(t.name) + " &middot; " + esc(t.site) + " &middot; " + esc(t.erp) + "</dd>" +
            "<dt>Antenna azimuth</dt><dd>" + esc(s.az) + "</dd>" +
            "<dt>Antenna gain</dt><dd>" + esc(s.g) + "</dd>" +
            "<dt>Antenna height AGL</dt><dd>" + esc(s.agl) + "</dd>" +
            "<dt>Height AMSL</dt><dd>" + esc(s.amsl) + "</dd>" +
            "<dt>Projected signal at donor site</dt><dd>" + esc(s.proj) + "</dd>" +
            "<dt>Equipment</dt><dd>" + esc(s.mfg) + " &middot; " + esc(s.cls) + "</dd>" +
            "<dt>Channels requested</dt><dd>" + esc(s.ch) + "</dd>" +
            "<dt>Jurisdiction</dt><dd>" + esc(jname(s.j)) + "</dd>" +
          "</dl>" +
          (r.cond
            ? '<div class="note" style="margin-bottom:0"><strong>' +
              (r.state === "no" ? "Why the request was declined." : "The conditions attached to the approval.") +
              "</strong> " + esc(r.cond) +
              (r.state === "no"
                ? " <em>The project goes back for redesign and returns as a new request.</em>"
                : "") + "</div>"
            : "") +
        "</div>" +
        '<div class="rail"><div class="rcard">' +
          "<h3>Decision</h3>" +
          '<p><span class="pill ' + d[1] + '">' + d[0] + "</span></p>" +
          (r.state === "waiting"
            ? '<p><button class="btn" data-act="ok">Approve</button> ' +
              '<button class="btn ghost" data-act="cond">Approve with conditions</button></p>' +
              '<p><button class="btn ghost" data-act="no">Decline</button></p>' +
              '<div id="dform" class="hid"><p id="dlab" class="small"></p>' +
                '<textarea id="dtext" rows="4" style="width:100%" placeholder=""></textarea>' +
                '<p><button class="btn" id="dsave">Record it</button> ' +
                '<button class="btn ghost" id="dcancel">Cancel</button></p></div>'
            : '<p class="small">Recorded ' + esc(r.tl[r.tl.length - 1][0]) + ".</p>") +
          '<div class="corr"><h4>What has happened to it</h4>' +
            "<p class=\"small\">" + esc(r.who) + "</p>" +
            "<ul class=\"tl\">" + tl + "</ul>" +
          "</div>" +
        "</div></div>" +
      "</div>" +
    "</div>";

  /* Approve is one click. A condition or a decline carries text, so it asks for it —
     both are decisions the platform records, not documents the LFH sends separately. */
  var pending = null;
  Array.prototype.forEach.call(box.querySelectorAll("button[data-act]"), function(b){
    b.addEventListener("click", function(){
      var act = b.dataset.act;
      if(act === "ok"){
        r.state = "ok";
        r.tl.push(["10 Sep 2026", "Approved by the License Frequency Holder", ""]);
        drawApprovals();
        return;
      }
      pending = act;
      $("dform").classList.remove("hid");
      $("dlab").textContent = act === "cond"
        ? "What are the conditions? These travel with the approval."
        : "Why is it declined? This goes back to the integrator as the brief for the redesign.";
      $("dtext").placeholder = act === "cond"
        ? "e.g. down-tilt the donor antenna 2° and re-measure at commissioning"
        : "e.g. the donor site named is not an approved donor for this system";
      $("dtext").focus();
    });
  });
  if($("dcancel")) $("dcancel").addEventListener("click", function(){
    pending = null; $("dform").classList.add("hid"); $("dtext").value = "";
  });
  if($("dsave")) $("dsave").addEventListener("click", function(){
    var txt = $("dtext").value.trim();
    if(!txt || !pending) return;
    r.state = pending;
    r.cond = txt;
    if(pending === "cond"){
      r.tl.push(["10 Sep 2026", "Approved with conditions by the License Frequency Holder", "The conditions travel with the approval."]);
    } else {
      r.tl.push(["10 Sep 2026", "Declined by the License Frequency Holder", "Sent back for redesign."]);
      r.tl.push(["—", "What happens next", "The project returns to design. It comes back as a new request, not an edit of this one."]);
    }
    drawApprovals();
  });
}

        (s.st === "deployed"
          ? '<p><button class="btn danger" disabled>Shut this system down</button></p>' +
            '<p class="small"><strong>Placeholder &mdash; the button does nothing.</strong> ' +
            "When it is built: the command goes to the network management system that reaches this " +
            "ERCES, and <strong>the License Frequency Holder is told within seconds that it is " +
            "off</strong>. At the same " +
            "moment an alarm sounds in the building. Nobody finds out later.</p>" +
            '<p class="small"><strong>Who is told, settled 16 Sep 2026.</strong> The AHJ ' +
            "<em>and</em> the License Frequency Holder &mdash; both, whichever party pulled the " +
            "switch, so neither is left " +
            "to find out on its own. Alongside them, the <strong>notification contacts the " +

            '<p class="small">The case this exists for is a system <strong>oscillating</strong> into ' +

var SCREENS = ["approvals", "map", "systems"];
function show(name){
  if(SCREENS.indexOf(name) < 0) name = SCREENS[0];
  SCREENS.forEach(function(s){
    $("pane-" + s).classList.toggle("hid", s !== name);
    $("tab-" + s).setAttribute("aria-selected", s === name ? "true" : "false");

  if(location.hash.slice(1) !== name) history.replaceState(null, "", "#" + name);
  window.scrollTo({top:0});
}
SCREENS.forEach(function(s){
  $("tab-" + s).addEventListener("click", function(){ show(s); });
});
window.addEventListener("hashchange", function(){ show(location.hash.slice(1)); });

drawApprovals();

sSel = firstSys();
drawSystems();
$("jcount").textContent = (JURIS.length + HIDDEN_PROGRAMS) + " Jurisdictions served";
show(location.hash.slice(1) || "approvals");

<script>
(function(){
  // Review chrome is identified by how a block OPENS, not by any mention anywhere -
  // "Facts only. No verdict." and "Who holds this project now" are product copy that
  // happens to sit near a dated citation, and blanket matching removed them.
  // Review chrome is identified by how a block OPENS, not by any mention anywhere -
  // "Facts only. No verdict." and "Who holds this project now" are product copy that
  // happens to sit near a dated citation.
  var HEAD = /^(settled|marked up|all four answered|what we (still )?need from you|what occupancy opened up|four questions|everything on this screen is answered|where these come from placeholder|open\s*(&mdash;|—|-)\s*not drawn here|\d+\s*[·.]\s)/i;
  var REVIEWY = /\byou (said|wrote|asked for)\b|your (words|position)\b|\bwe (may have|picked|guessed)\b|unrefuted|tabled|still a slot|phase one, exactly/i;
  var CITE = [
    /\b(Your words|Your position|You said|You wrote|Rob said|Rob:|Rob,)[^.!?]*[.!?]\s*/gi,
    /\bSettled\b[^.!?]*[.!?]\s*/gi,
    /\bMarked up\b[^.!?]*[.!?]\s*/gi
  ];
  var sweeping = false;
  var txtOf = function(el){ return (el.textContent || '').replace(/\s+/g, ' ').trim(); };

  // A screen may opt out of the inline glossary underlines - the program screen does, because
  // its own heading is the jargon. The words stay in the glossary panel; they lose the marking.
  function termsOff(){ return !!document.querySelector('[data-um="no-inline-terms"]'); }

  function decite(el){
    var hit = false, w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null), ns = [], n;
    while((n = w.nextNode())) ns.push(n);
    ns.forEach(function(t){
      var before = t.nodeValue, after = before;
      CITE.forEach(function(re){ after = after.replace(re, ''); });
      if(after !== before){ t.nodeValue = after; hit = true; }
    });
    if(hit){
      el.querySelectorAll('em,i,blockquote').forEach(function(q){
        if(/^["“‘']/.test((q.textContent || '').trim())) q.remove();
      });
      if(!txtOf(el)) el.remove();
    }
    return hit;
  }

  // A note box is a note box however true its contents. The useful ones keep their
  // words but lose the callout: they become a quiet info chip you open if you want it.
  function toChip(el){
    if(termsOff()){ el.remove(); return; }
    var head = el.querySelector('strong,b,h4');
    var label = head ? txtOf(head).replace(/[.:—-]\s*$/, '') : 'About this';
    var body = el.innerHTML;
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'um-chip um-def';
    chip.dataset.t = label;
    chip.dataset.d = body;
    chip.textContent = label;
    el.parentNode.replaceChild(chip, el);
  }

  function sweep(){
    if(sweeping) return; sweeping = true;
    try{
      document.querySelectorAll('.proto,.ask,.askbox,.lineage').forEach(function(el){ el.remove(); });
      document.querySelectorAll('.rcard,.corr').forEach(function(el){
        if(HEAD.test(txtOf(el)) || REVIEWY.test(txtOf(el))) el.remove(); else decite(el);
      });
      document.querySelectorAll('.note').forEach(function(el){
        var t = txtOf(el);
        if(HEAD.test(t) || REVIEWY.test(t)){ el.remove(); return; }
        decite(el);
        if(el.parentNode && txtOf(el)) toChip(el);
      });
      document.querySelectorAll('.rail').forEach(function(r){
        if(!r.querySelector('*')){
          r.style.display = 'none';
          var c = r.closest ? r.closest('.cols') : null;
          if(c) c.style.gridTemplateColumns = 'minmax(0,1fr)';
        }
      });
    } finally { sweeping = false; }
  }

  var TERMS = [
   ["ERCES","Emergency Responder Communication Enhancement System. Equipment installed in a building so firefighters and police keep radio coverage inside it — thick walls and basements are where ordinary portable radios fail."],
   ["BDA","Bi-Directional Amplifier. The box at the heart of most systems: it takes the public-safety signal from outside, amplifies it, and rebroadcasts it indoors — and back out again."],
   ["AHJ","Authority Having Jurisdiction — in practice the fire marshal or fire code official. The party that decides whether a building needs a system and whether the finished one is acceptable."],
   ["benchmark test","A radio survey of the building as it stands today, before anything is installed. It is the evidence the fire marshal weighs when deciding whether a system is needed at all."],
   ["acceptance test","The radio survey of the finished, installed system. Same measurements as the benchmark, taken to prove the system does what the design promised."],
   ["annual test","The recurring test an owner owes every year for as long as the system exists. It is graded against the jurisdiction's current requirements, not the ones in force when the building was approved."],
   ["margin","How far a measurement sits from the threshold it is judged against, rather than simply which side of it landed. Three decibels short is a very different conversation from thirty."],
   ["donor antenna","The rooftop antenna that talks to the public-safety tower. Everything indoors depends on this one link."],
   ["retransmission authorization","The frequency holder's written permission to rebroadcast its channels inside a building. Without it there is nothing lawful to amplify, whatever the fire marshal says."],
   ["frequency holder","The public-safety agency that actually holds the radio licence — often a county or a statewide network. It owns the channels a building's system rebroadcasts."],
   ["integrator","The firm that designs, installs, tests and maintains the system. The owner is responsible for compliance; the integrator is who does the work."],
   ["waiver","A fire marshal's written record that a building was accepted without meeting the coverage criteria. It does not expire, it binds whoever holds the office next, and only a change to the building reopens it."],
   ["as-built","The record of what was actually installed, which is rarely exactly what was drawn. Filed after installation and before the acceptance test."],
   ["vesting","The moment a project's rulebook is fixed. Approval of the design settles which edition of the code the job is measured against, even if the county changes its rules later."],
   ["program","Everything a jurisdiction has configured for itself — the code edition it adopted, its technical requirements, and what it asks to be filed. Every project in that jurisdiction is measured against it."],

<section id="stageRef">
  <div class="shead"><h2>The Seven Stages</h2>
  <span class="snum">THE SAME SEVEN EVERYWHERE</span></div>
  <div class="sbody">
    <p class="small" style="margin:0 0 4px">What each stage asks, what it files and who receives it
    is the same in every jurisdiction and on every project. What differs is where a project stands
    in them &mdash; which is what a project's record shows.</p>
    <div id="stages"></div>
    <div class="rcard" style="margin-top:16px">
    <h3>Filing Again</h3>
    <p class="small">A stage already filed can be filed again &mdash; a redesign after a decline, a
    corrected report. <strong>Nothing is locked.</strong> The new filing does not overwrite
    the old one: both stay on the record, so a refusal and what replaced it can both be read later.</p>
  </div>
    <div class="askbox" style="margin-top:16px">
  <h4>Settled 14 Sep 2026</h4>
  <ul>
    <li><strong>The native iBwave file is required.</strong> Not accepted-if-you-have-it. A stage 4 or
      5 submittal without a <span class="num">.ibw</span> does not go through.</li>
    <li><strong>A scanned test report is blocked</strong>, and the rule is wider than scans: <em>"we
      should only accept PCTEL or equivalent reports that we can extract data from easily."</em> The
      test is whether we can read the values out, not whether a human can.</li>
    <li><strong>The integrator submits nothing at stage 2.</strong> <em>"This is only a
      determination."</em> It has no inbound side &mdash; the decision comes back to you.</li>
  </ul>
  <h4 style="margin-top:12px">Still open</h4>
  <ul>
    <li><strong>What counts as "equivalent"?</strong> About one test in ten is run on something other
      than a PCTEL SeeHawk, and nobody has looked at what those tools produce. Until that is answered
      the rule accepts one known format and refuses an unknown number of legitimate ones.</li>
  </ul>
</div>
  </div>
</section>


<div class="askbox">
  <h4>Settled 14 Sep 2026</h4>
  <ul>
    <li><strong>Whose court the ball is in is the right spine.</strong> <em>"I like the idea of
      indicating whose ball the court is in."</em> Three alternatives were offered and none taken.</li>
    <li><strong>One row per project, not per building.</strong> Westgate stays as one row with its
      part-approved marker, even though testing and approval are both per building.</li>
    <li><strong>Show the number and stop.</strong> <em>"Just show the number, no action or buttons
      are required."</em> The reminder button is gone, and 94 days is set in plain type rather than
      amber &mdash; it is a fact, not a warning.</li>
  </ul>
  <h4 style="margin-top:12px">Added 16 Sep 2026 &mdash; the clock panel</h4>
  <ul>
    <li><strong>Rob asked for a recommendation and took it.</strong> Not a seventh tab &mdash; the
      same panel the AHJ&rsquo;s queue already carries, because you have <strong>five</strong>
      date-driven things, not one: annual tests, your agreements, your certifications, your insurance,
      and the frequency holder&rsquo;s renewals.</li>
    <li><strong>It stops at what is due.</strong> No scheduling, no assigning a crew, no invoicing.
      That boundary is deliberate and is the thing to push on if it is wrong.</li>
  </ul>
  <h4 style="margin-top:12px">Still open</h4>
  <ul>
    <li>&#9888; <strong>&ldquo;Overdue&rdquo; is on screen for the first time.</strong> You allowed the
      word today for stage 7, answering the county repair-date question. A <em>lapsed annual test</em>
      is also stage 7, so it is shown the same way &mdash; but that is our reading of your ruling, not
      your ruling. <strong>Is a late annual test overdue?</strong></li>
    <li>&#9888; <strong>The tiles are clickable, and you said &ldquo;just show the number, no action or
      buttons are required.&rdquo;</strong> Clicking filters the list rather than doing anything to a
      project, so we read it as navigation rather than an action &mdash; but say if the tiles should
      simply sit there.</li>
  </ul>
  <h4 style="margin-top:12px">Closed 16 Sep 2026 &mdash; the surface is finished</h4>
  <ul>
    <li><strong>Rob: &ldquo;correctly excluded.&rdquo;</strong> Rows 1&ndash;3 (lead, quote, contract),
      10&ndash;11 (equipment, crews) and 17 (invoicing) belong to the estimating and accounting
      software you already run. <strong>This portal is the compliance record, not the business
      system</strong> &mdash; a boundary stated on purpose rather than arrived at by omission.</li>
    <li><strong>The format was the fix, not the wording.</strong> Asked twice as a question
      (&ldquo;what part of your week is on none of these screens?&rdquo;) it went unanswered twice.
      Re-put as one job in eighteen steps with a guessed screen against each, it was answered in
      four words.</li>
  </ul>
</div>

  <p class="sub"><span class="num">CWI&ndash;2026&ndash;0141</span> &middot; Cardinal Ridge Health

<section>
  <div class="shead"><h2>The Rules This Project was Measured Against, and the Rules Now</h2><span class="snum">RALEIGH &middot; NC VIPER</span></div>

        <h4>Current, today</h4>
        <div class="v">Raleigh ERCES Program v2026.1</div>
        <div class="dt">effective 1 Feb 2026 &mdash; 2 versions on</div>
        <div class="v" style="margin-top:9px">NC VIPER profile v2026.2</div>
        <div class="dt">effective 1 Mar 2026 &mdash; changed by VIPER, not by Raleigh</div>
      </div>
    </div>

    <ul class="deltas">
      <li><span class="lab">Minimum DAQ, general areas</span><span class="mv">3.0 &rarr; 3.4</span></li>
      <li><span class="lab">Critical area coverage</span><span class="mv">99% &rarr; 99% &middot; unchanged</span></li>

    <div class="note q" style="margin-bottom:0">
      <p><strong>Facts only. No verdict.</strong> Nothing here says this system is non-compliant, out

      <p><strong>What it does mean, settled 10 Sep 2026:</strong> the annual test is graded

<div>

  <section>

  <section>
    <div class="shead"><h2>Moving This Project to Another Firm</h2><span class="snum">NO APPROVAL NEEDED</span></div>
    <div class="sbody">
      <p class="small" style="margin-top:0">An owner who changes servicing firms does not need the
      AHJ's permission to do it. <strong>The signed agreement is enough on its own</strong>
      &mdash; the authority is told, never asked.</p>
      <ul class="tl">
        <li><span class="d">step 1 &middot; the incoming firm</span> Requests the transfer, naming an
          effective date and attaching the signed owner&ndash;to&ndash;firm maintenance and monitoring
          agreement. That signature is the owner's consent, and it is the only form consent can take
          from a party who never logs in.</li>
        <li><span class="d">step 2 &middot; the platform</span> Notifies the outgoing firm, the AHJ and the owner of record. Facts only &mdash; nobody is asked to decide.</li>
        <li><span class="d">step 3 &middot; on receipt</span> The transfer takes effect. There is no
          approval gate and nothing to wait for.</li>
        <li><span class="d">step 4 &middot; the record</span> The project moves with all of its
          history. A project never splits.</li>
        <li><span class="d">step 5 &middot; afterwards</span> The outgoing firm keeps read access to
          everything it filed and loses the ability to file anything new.</li>
      </ul>
      <dl class="facts" style="margin-top:16px">
        <dt>Access here</dt><dd>Full &mdash; the ERCES Integrator of record</dd>
        <dt>If replaced</dt><dd>Read-only on the six stages filed, indefinitely</dd>
        <dt>Alert raised</dt><dd class="dim">None of its own &mdash; see below</dd>
      </dl>
    </div>
  </section>
</div>

<div class="rail">
  <div class="rcard">
    <h3>Who Holds This Project Now</h3>
    <dl class="facts" style="grid-template-columns:110px minmax(0,1fr)">
      <dt>Integrator</dt><dd>Carolina Wireless Integration</dd>
      <dt>Owner</dt><dd>Cardinal Ridge Health, since 4 Nov 2025</dd>
      <dt>Monitoring</dt><dd>This system, under the M&amp;M agreement</dd>
      <dt>Testing firm</dt><dd>Piedmont RF Compliance, LLC<br>
        <span class="small">Third party, hired by the ERCES Integrator. Raleigh requires one.</span></dd>
    </dl>
    <p class="small" style="margin-top:10px">Shown here because Raleigh's program requires one &mdash;
    a jurisdiction that does not require a third party has no such line. Testing stays the ERCES
    Integrator's responsibility either way.</p>
    <div class="corr">
      <h4>What approval does</h4>
      <p class="small">Approval is what completes this project &mdash; not submission. Raleigh
      received the acceptance test on 4 Nov 2025, and the project stayed open, with anything the
      review recorded still against it, until the AHJ approved it.</p>
      <p class="small">Nothing changes hands on approval. <strong>The ERCES Integrator of record
      holds the project for the life of the system</strong> &mdash; through the annual tests and the
      maintenance agreement that follow it.</p>
    </div>
  </div>
  <div class="rcard">
    <h3>Shutdown</h3>
    <p class="small">VIPER can shut this system down through the monitoring system, and Raleigh holds
    that button too. The portal passes the instruction through; it does not decide and takes no
    responsibility for it. <strong>Nothing about that is built yet</strong> &mdash; it is phase two,
    and it is here as a placeholder; whether it belongs on this screen at all is still open.</p>
  </div>
</div>
</div>

<div class="askbox">
  <h4>Settled 16 Sep 2026</h4>
  <ul>
    <li><strong>The handoff is at approval, not submission</strong> &mdash; <em>"the handoff should be
      after the acceptance test has been approved by the AHJ."</em> The window this screen once
      described, where the owner holds a project with the integrator's deficiency outstanding, never
      existed. Recorded in the rail, and the lifecycle write-up was corrected rather than appended
      to. <b>Retired 23 Sep 2026 &mdash; put to bed.</b> With the owner held as an address rather than
      a seat there is no second party for a project to pass to, so nothing changes hands and the
      question this answered no longer arises. What survives is that approval completes a project,
      and submission does not.</li>
    <li><strong>A project moves firms on the document alone</strong> &mdash; <em>"a signed agreement
      is enough on its own, we need to keep the AHJ out of commercial matters. The outgoing
      integrator keeps read access. Only one alert."</em> Built as its own section on this screen.</li>
  </ul>

var SAY={lock:"Fixed by the code this jurisdiction adopted.",
         lfh:"Set by the License Frequency Holder.",
         gear:"Chosen by this jurisdiction.",
         star:"A recommended default this jurisdiction accepted."};
function prow(label,value,prov){
  return '<div class="prow"><span class="pl">'+esc(label)+'</span>'+
    '<span class="pv"><b>'+esc(value)+'</b><span class="pd">'+SAY[prov]+'</span></span></div>';
}
function jval(j,label){
  var r=j.R.filter(function(x){ return x[0]===label; })[0];
  return r ? r[1] : '\u2014';
}
/* The same five questions the authority's page asks of its document, answered from this program. */
function jpoints(j){
  return [
    ["Coverage is judged by DAQ "+jval(j,'Minimum DAQ')+".",
     "General area coverage "+jval(j,'General area coverage')+", critical areas "+jval(j,'Critical area coverage')+"."],
    ["The uplink is capped at "+jval(j,'Uplink noise limit at donor')+" at the donor.",
     "Isolation margin "+jval(j,'Isolation margin')+"."],
    ["The equipment is specified.",
     jval(j,'Amplifier class')+" \u00b7 battery backup "+jval(j,'Battery backup')+"."],
    ["Third-party testing: "+jval(j,'Third-party testing firm')+".",
     "Accepted report format: "+jval(j,'Report format')+"."],
    ["The code it follows.",
     j.L.map(function(l){ return l[1]; }).join(" \u00b7 ")+"."]
  ];
}
function drawJ(){
  var j=J[+$("#jsel").value];
  $("#jstat").innerHTML = j.have
    ? '<span class="pill p-ok">program on file &middot; '+esc(j.v)+'</span>'
    : '<span class="pill p-flat">not set up here</span>';
  if(!j.have){
    $("#jbody").innerHTML='<div class="empty"><strong>'+esc(j.n)+' has not set up a program here.</strong>'+
      '<p style="margin:9px 0 0">This is a mirror of what an AHJ publishes. Until this one '+
      'signs up there is nothing to mirror, so there is nothing to read &mdash; the jurisdiction&rsquo;s own website is where it is published.</p></div>';
    $("#jgap").innerHTML='<h3>The Awkward Half of This Answer</h3>'+
      '<p class="small">Reading requirements before a project is only useful where the jurisdiction '+
      'is <strong>in</strong> the platform. <strong>Early on, most will look like this one.</strong> '+
      'Three of the ten in this list are empty, and that ratio is optimistic.</p>'+
      '<p class="small">Open question for Rob: is an empty jurisdiction worth showing at all &mdash; '+
      'and should anything be held for one, even a link to its site?</p>';
    return;
  }

  var docCard =
    '<section><div class="shead"><h2>AHJ Program Document</h2>'+
    '<span class="snum">'+esc(j.doc.n)+'</span></div>'+
    '<div class="sbody"><div class="doc"><div class="glyph">PDF</div><div class="what">'+
    '<div class="nm">'+esc(j.doc.n)+'</div>'+

    '<div class="hash">SHA-256 '+esc(j.doc.h)+' &mdash; kept as received, never rewritten</div>'+
    '</div></div></div></section>';

  var briefHead = '<div class="brief"><h3>What This Program Decides</h3>'+
    '<p class="blead">What the ERCES Integrator is asked to build &mdash; and where the program '+
    'departs from standard practice.</p>';
  var summaryHead = '<section><div class="shead"><h2>Program Summary</h2>'+
    '<span class="snum">read from the jurisdiction\'s document</span></div><div class="sbody">';
  var body;

  if(j.read){
    /* A jurisdiction whose document has actually been read: the same reading the authority
       sees, element for element, rather than a second rendering of the same fields. */
    var rows=0, gaps=0;
    j.read.groups.forEach(function(L){ L.rows.forEach(function(r){ rows++; if(!r.v && !r.set) gaps++; }); });
    body = briefHead + j.read.pts.map(function(x){
        return '<div class="brow"><span><b>'+x.b+'</b><span class="bt">'+x.t+'</span></span></div>';
      }).join("")+'</div>'+
      '<p class="ptally">'+
      '<span><b>'+(rows-gaps)+'</b> of '+rows+' elements read from the document</span>'+
      '<span><b>'+gaps+'</b> not stated in it</span></p>'+
      j.read.groups.map(function(L){
        return '<div class="lay"><h3>'+L.g+'</h3>'+L.rows.map(function(r){
          if(r.set) return '<div class="prow"><span class="pl">'+r.el+'</span><span class="pv"><b>'+
            r.set+'</b><span class="pd">Set by the AHJ &mdash; not read from the document.'+
            '</span></span></div>';
          if(r.v) return '<div class="prow"><span class="pl">'+r.el+'</span><span class="pv"><b>'+r.v+
            '</b>'+(r.sub?'<span class="pd">'+r.sub+'</span>':'')+'</span></div>';
          return '<div class="prow"><span class="pl">'+r.el+'</span><span class="pv"><b>Not found.</b>'+
            '<span class="pd">'+r.missing+'</span></span></div>';
        }).join("")+'</div>';
      }).join("");
  } else {
    var byProv=function(k){ return j.R.filter(function(r){ return r[2]===k; }).length; };
    body = briefHead + jpoints(j).map(function(x){
        return '<div class="brow"><span><b>'+x[0]+'</b><span class="bt">'+x[1]+'</span></span></div>';
      }).join("")+'</div>'+
      '<p class="ptally">'+
      '<span><b>'+j.R.length+'</b> requirements in this program</span>'+
      '<span><b>'+byProv("lock")+'</b> fixed by the code it adopted</span>'+
      '<span><b>'+byProv("lfh")+'</b> set by the License Frequency Holder</span>'+
      '<span><b>'+(byProv("gear")+byProv("star"))+'</b> this jurisdiction\'s own</span>'+
      '</p>'+
      '<div class="lay"><h3>The Code This Jurisdiction Follows</h3>'+
      j.L.map(function(l){ return prow(l[0], l[1], l[2]); }).join("")+'</div>'+
      '<div class="lay"><h3>What It Requires</h3>'+
      j.R.map(function(r){ return prow(r[0], r[1], r[2]); }).join("")+'</div>';
  }

  $("#jbody").innerHTML = docCard + summaryHead + body + '</div></section>';
  $("#jgap").innerHTML='<h3>'+(j.work?'The ERCES Integrator works here':'The ERCES Integrator has not worked here')+'</h3>'+
    '<p class="small">'+(j.work
      ? 'The ERCES Integrator has projects in this jurisdiction, so this is the same program those projects are measured against.'
      : 'No projects here. This is exactly the case Rob described &mdash; reading a jurisdiction\'s rules before there is anything to file.')+'</p>';
}

<script>
(function(){
  // Review chrome is identified by how a block OPENS, not by any mention anywhere -

  // Review chrome is identified by how a block OPENS, not by any mention anywhere -
  // "Facts only. No verdict." and "Who holds this project now" are product copy that

  var HEAD = /^(settled|marked up|all four answered|what we (still )?need from you|what occupancy opened up|four questions|everything on this screen is answered|where these come from placeholder|open\s*(&mdash;|—|-)\s*not drawn here|\d+\s*[·.]\s)/i;

  var CITE = [
    /\b(Your words|Your position|You said|You wrote|Rob said|Rob:|Rob,)[^.!?]*[.!?]\s*/gi,
    /\bSettled\b[^.!?]*[.!?]\s*/gi,
    /\bMarked up\b[^.!?]*[.!?]\s*/gi

  // its own heading is the jargon. The words stay in the glossary panel; they lose the marking.

      if(after !== before){ t.nodeValue = after; hit = true; }
    });

      el.querySelectorAll('em,i,blockquote').forEach(function(q){
        if(/^["“‘']/.test((q.textContent || '').trim())) q.remove();
      });
      if(!txtOf(el)) el.remove();
    }
    return hit;
  }

  // A note box is a note box however true its contents. The useful ones keep their
  // words but lose the callout: they become a quiet info chip you open if you want it.
  function toChip(el){
    if(termsOff()){ el.remove(); return; }
    var head = el.querySelector('strong,b,h4');

  var TERMS = [

   ["BDA","Bi-Directional Amplifier. The box at the heart of most systems: it takes the public-safety signal from outside, amplifies it, and rebroadcasts it indoors — and back out again."],

  ];

  addEventListener('resize', close);

  var SKIP = {SCRIPT:1,STYLE:1,TEXTAREA:1,TITLE:1,OPTION:1,SELECT:1,SVG:1,svg:1,TEMPLATE:1};
  function decorate(){
    if(termsOff()) return;
    var done = {};
    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
      acceptNode: function(n){
        if(!n.nodeValue || n.nodeValue.length < 3) return NodeFilter.FILTER_REJECT;
        for(var p = n.parentNode; p && p !== document.body; p = p.parentNode){
          if(SKIP[p.nodeName] || (p.classList && p.classList.contains('um-def'))) return NodeFilter.FILTER_REJECT;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var texts = [], t;
    while((t = walker.nextNode())) texts.push(t);

    for(var i=0;i<texts.length;i++){
      var node = texts[i];
      for(var j=0;j<TERMS.length;j++){
        var term = TERMS[j][0];
        if(done[term]) continue;
        var re = new RegExp('(^|[^A-Za-z-])(' + term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')(?![A-Za-z-])',
                            term === term.toUpperCase() ? '' : 'i');
        var m = re.exec(node.nodeValue);
        if(!m) continue;
        var start = m.index + m[1].length;
        var span = document.createElement('span');
        span.className = 'um-def'; span.tabIndex = 0;
        span.setAttribute('role','button');
        span.dataset.t = term; span.dataset.d = TERMS[j][1];
        span.title = 'What this means';
        var after = node.splitText(start);
        after.splitText(m[2].length);
        span.textContent = after.nodeValue;
        after.parentNode.replaceChild(span, after);
        done[term] = 1;
        break;
      }
    }
  }

  function boot(){ sweep(); decorate(); }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
  setTimeout(boot, 400);
  setTimeout(sweep, 1200);
  new MutationObserver(function(){ sweep(); }).observe(document.documentElement, {childList:true, subtree:true});
})();
</script>

  ];
  var stage = document.getElementById('stage'), tabsEl = document.getElementById('tabs');
